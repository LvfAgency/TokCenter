<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TokCenter — LVF</title>

<style>
:root{
    --bg:#f4f6fa;
    --card:#fff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --primary-soft:#ede9fe;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --success:#059669;
    --blue:#2563eb;
    --orange:#f59e0b;
    --shadow:0 10px 30px rgba(17,24,39,.08);
    --radius:18px;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.app{min-height:100vh;display:flex}

/* ================= SIDEBAR ================= */

.sidebar{
    width:245px;
    background:linear-gradient(180deg,#111827,#171b2e);
    color:#fff;
    padding:18px 12px;
    position:fixed;
    inset:0 auto 0 0;
    z-index:30;
    box-shadow:8px 0 25px rgba(0,0,0,.08);
    overflow-y:auto;
}

.logo{
    padding:8px 12px 25px;
    font-size:27px;
    font-weight:950;
    letter-spacing:-1.5px;
}

.logo span{color:#a78bfa}

.logo-sub{
    display:block;
    font-size:10px;
    letter-spacing:1.4px;
    color:#9ca3af;
    text-transform:uppercase;
    margin-top:4px;
    font-weight:700;
}

.nav{
    display:grid;
    gap:6px;
}

.nav button{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:12px 13px;
    border-radius:13px;
    font-weight:750;
    transition:.18s;
}

.nav button:hover{
    background:rgba(124,58,237,.18);
    color:#fff;
}

.nav button.active{
    background:linear-gradient(135deg,#6d28d9,#7c3aed);
    color:#fff;
    box-shadow:0 7px 18px rgba(124,58,237,.28);
}

.nav-icon{
    width:28px;
    min-width:28px;
    height:28px;
    display:grid;
    place-items:center;
    font-size:20px;
}

.nav-text{white-space:nowrap}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    width:calc(100% - 245px);
    padding:28px;
    max-width:1600px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:30px;
    letter-spacing:-.7px;
}

.title p{
    margin:5px 0 0;
    color:var(--muted);
}

/* ================= BUTTONS ================= */

.btn{
    padding:11px 16px;
    border-radius:11px;
    font-weight:800;
    transition:.15s;
}

.btn:hover{transform:translateY(-1px)}

.primary{
    background:var(--primary);
    color:#fff;
}

.primary:hover{background:var(--primary-dark)}

.secondary{
    background:#eef2ff;
    color:#4338ca;
}

.ghost{
    background:#f3f4f6;
    color:#374151;
}

.danger{
    background:var(--danger-soft);
    color:#991b1b;
}

.success{
    background:#d1fae5;
    color:#065f46;
}

.star{
    background:#fff7ed;
    color:#f59e0b;
    font-size:19px;
}

/* ================= CARDS ================= */

.grid{
    display:grid;
    gap:18px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.cards{
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
}

.card:hover{border-color:#ddd6fe}

.stat .label{
    color:var(--muted);
    font-weight:700;
}

.stat .num{
    font-size:32px;
    font-weight:950;
    margin-top:8px;
}

.section{margin-top:25px}

.section h2{
    font-size:19px;
    margin:0 0 13px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    background:var(--primary-soft);
    color:#5b21b6;
    font-size:12px;
    font-weight:850;
}

.muted{color:var(--muted);font-size:14px}
.small{font-size:12px}

.empty{
    padding:38px;
    text-align:center;
    color:var(--muted);
    background:#fff;
    border:1px dashed #d1d5db;
    border-radius:16px;
}

.list{
    display:grid;
    gap:10px;
}

.listitem{
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px;
    background:#fafafa;
}

/* ================= AVATAR ================= */

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#ede9fe;
    display:grid;
    place-items:center;
    font-weight:900;
    color:#5b21b6;
    flex:none;
}

.avatar.big{
    width:82px;
    height:82px;
    font-size:28px;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
}

/* ================= SEARCH ================= */

.search{margin-bottom:16px}

.search input{
    width:100%;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fff;
    outline:none;
}

.search input:focus,
.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#a78bfa;
    box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

/* ================= TEAMS ================= */

.teamhead{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.teamicon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:linear-gradient(135deg,#111827,#312e81);
    color:#fff;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:20px;
    flex:none;
}

/* ================= MATCH ================= */

.match{
    border-left:5px solid var(--primary);
}

.match .date{font-weight:900}

.vs{
    font-size:17px;
    font-weight:900;
    line-height:1.45;
}

.status{
    font-size:12px;
    font-weight:900;
}

.upcoming{color:var(--blue)}
.done{color:var(--success)}

/* ================= AGENCIES ================= */

.favorite{
    background:#fffdf7;
    border-color:#fde68a;
}

.agency-card{
    position:relative;
    overflow:hidden;
}

.agency-card.favorite::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:#f59e0b;
}

.agency-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:#111827;
    color:#fff;
    font-weight:950;
    font-size:20px;
    flex:none;
}

.notice{
    padding:13px 15px;
    background:#f5f3ff;
    border:1px solid #ddd6fe;
    border-radius:13px;
    color:#4c1d95;
    margin-bottom:15px;
}

/* ================= TABS ================= */

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-bottom:18px;
}

.tab{
    background:#e5e7eb;
    padding:10px 15px;
    border-radius:10px;
    font-weight:800;
    white-space:nowrap;
}

.tab.active{
    background:#111827;
    color:#fff;
}

/* ================= PROGRESS ================= */

.progress{
    height:10px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
    margin-top:10px;
}

.progress > div{
    height:100%;
    background:linear-gradient(90deg,#7c3aed,#a78bfa);
    border-radius:999px;
}

/* ================= CHART ================= */

.chart{
    width:100%;
    height:260px;
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:20px 5px 0;
    border-bottom:1px solid var(--line);
}

.bar{
    flex:1;
    min-width:15px;
    background:linear-gradient(180deg,#8b5cf6,#6d28d9);
    border-radius:7px 7px 0 0;
    position:relative;
}

.bar span{
    position:absolute;
    bottom:-24px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    color:var(--muted);
    white-space:nowrap;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    backdrop-filter:blur(3px);
}

.modal.open{display:flex}

.modalbox{
    background:#fff;
    border-radius:21px;
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:19px;
}

.modalhead h2{margin:0}

.close{
    background:#f3f4f6;
    border-radius:10px;
    padding:8px 11px;
}

/* ================= FORMS ================= */

.formgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    display:grid;
    gap:6px;
}

.field.full{grid-column:1/-1}

.field label{
    font-weight:800;
    font-size:13px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:11px;
    background:#fff;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.file{
    border:1px dashed #c4b5fd;
    background:#faf5ff;
    padding:14px;
    border-radius:12px;
}

.preview{margin-top:8px}

hr{
    border:0;
    border-top:1px solid var(--line);
    margin:18px 0;
}

/* ================= DASHBOARD ================= */

.dashboard-card{
    min-height:120px;
}

.quick-info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.info-box{
    padding:15px;
    border:1px solid var(--line);
    border-radius:14px;
    background:#fafafa;
}

.info-box strong{
    display:block;
    font-size:23px;
    margin-top:5px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1000px){

    .sidebar{
        width:78px;
        padding:15px 9px;
    }

    .logo{
        font-size:0;
        text-align:center;
        padding-left:0;
        padding-right:0;
    }

    .logo:before{
        content:"TC";
        font-size:22px;
    }

    .logo span,
    .logo-sub,
    .nav-text{
        display:none;
    }

    .nav button{
        justify-content:center;
        padding:13px;
    }

    .nav-icon{
        width:auto;
    }

    .main{
        margin-left:78px;
        width:calc(100% - 78px);
        padding:18px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:700px){

    .formgrid{
        grid-template-columns:1fr;
    }

    .field.full{grid-column:auto}

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .quick-info{
        grid-template-columns:1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .modalbox{padding:19px}
}

@media(max-width:480px){

    .stats{
        grid-template-columns:1fr;
    }

    .title h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        Tok<span>Center</span>
        <span class="logo-sub">LVF — La Vraie Famille</span>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>

<main class="main">

    <div class="topbar">

        <div class="title">
            <h1 id="pageTitle">Tableau de bord</h1>
            <p id="pageSubtitle">Vue d'ensemble de LVF.</p>
        </div>

    </div>

    <div id="content"></div>

</main>

</div>

<div class="modal" id="modal">

    <div class="modalbox">

        <div class="modalhead">

            <h2 id="modalTitle"></h2>

            <button class="close" onclick="closeModal()">✕</button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>

<script>

/* =========================================================
   BASE DE DONNÉES
========================================================= */

const STORAGE_KEY = "tokcenter_v7";

const defaultDB = {
    creators:[],
    teams:[],
    managers:[],
    matches:[],
    agencies:[],
    applications:[],
    monthlyStats:[],
    settings:{
        agencyName:"LVF — La Vraie Famille"
    }
};

let db = loadDB();

let page = "dashboard";

let creatorSearch = "";
let teamSearch = "";
let agencySearch = "";
let managerSearch = "";
let applicationSearch = "";

let pendingAvatar = "";


/* =========================================================
   SAUVEGARDE
========================================================= */

function loadDB(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        if(!saved) return structuredClone(defaultDB);

        return {
            ...structuredClone(defaultDB),
            ...saved,
            creators:saved.creators || [],
            teams:saved.teams || [],
            managers:saved.managers || [],
            matches:saved.matches || [],
            agencies:saved.agencies || [],
            applications:saved.applications || [],
            monthlyStats:saved.monthlyStats || [],
            settings:{
                ...defaultDB.settings,
                ...(saved.settings || {})
            }
        };

    }catch(e){

        return structuredClone(defaultDB);

    }

}

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

}


/* =========================================================
   OUTILS
========================================================= */

function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2,9);

}

function esc(value=""){

    return String(value).replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );

}

function fmtDate(value){

    if(!value) return "—";

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}

function fmtDT(value){

    if(!value) return "—";

    const d = new Date(value);

    return d.toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ) +
    " à " +
    d.toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

function initials(name){

    return (name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}

function creator(id){
    return db.creators.find(x => x.id === id);
}

function team(id){
    return db.teams.find(x => x.id === id);
}

function manager(id){
    return db.managers.find(x => x.id === id);
}

function agency(id){
    return db.agencies.find(x => x.id === id);
}

function avatar(c,big=false){

    if(c && c.avatar){

        return `
            <img
                class="avatar ${big ? "big" : ""}"
                src="${c.avatar}"
                alt=""
            >
        `;

    }

    return `
        <div class="avatar ${big ? "big" : ""}">
            ${esc(initials(c?.name || "?"))}
        </div>
    `;

}

function roleBadge(role){

    return `
        <span class="badge">
            ${esc(role || "Créateur")}
        </span>
    `;

}

function euroNumber(value){

    return Number(value || 0)
        .toLocaleString("fr-FR");

}

function diamondNumber(value){

    return Number(value || 0)
        .toLocaleString("fr-FR");

}


/* =========================================================
   NAVIGATION
========================================================= */

const navItems = [

    ["dashboard","🏠","Tableau de bord"],

    ["teams","👥","Teams"],

    ["creators","👤","Créateurs"],

    ["managers","👔","Managers"],

    ["matches","⚔️","Matchs OFF"],

    ["agencies","🏢","Agences adverses"],

    ["statistics","📊","Statistiques"],

    ["applications","📋","Candidatures"],

    ["calendar","📅","Calendrier"],

    ["settings","⚙️","Paramètres"]

];

function renderNav(){

    document.getElementById("nav").innerHTML =
        navItems.map(
            item => `

                <button
                    class="${page === item[0] ? "active" : ""}"
                    onclick="go('${item[0]}')"
                    title="${esc(item[2])}"
                >

                    <span class="nav-icon">
                        ${item[1]}
                    </span>

                    <span class="nav-text">
                        ${esc(item[2])}
                    </span>

                </button>

            `
        ).join("");

}

function go(newPage){

    page = newPage;

    renderNav();

    render();

}


/* =========================================================
   RENDU
========================================================= */

const views = {};

function render(){

    const titles = {

        dashboard:[
            "Tableau de bord",
            "Vue d'ensemble de LVF — La Vraie Famille."
        ],

        teams:[
            "Teams",
            "Gérez vos équipes, managers et créateurs."
        ],

        creators:[
            "Créateurs",
            "Gérez les créateurs de LVF."
        ],

        managers:[
            "Managers",
            "Gérez les managers et leurs créateurs."
        ],

        matches:[
            "Matchs OFF",
            "Créez et suivez vos matchs."
        ],

        agencies:[
            "Agences adverses",
            "Votre carnet d'agences se met à jour automatiquement."
        ],

        statistics:[
            "Statistiques",
            "Suivez les performances de LVF et de vos Teams."
        ],

        applications:[
            "Candidatures",
            "Suivez les candidatures et leur évolution."
        ],

        calendar:[
            "Calendrier",
            "Tous vos matchs classés par date."
        ],

        settings:[
            "Paramètres",
            "Gestion des données et du fonctionnement de TokCenter."
        ]

    };

    document.getElementById("pageTitle")
        .textContent = titles[page][0];

    document.getElementById("pageSubtitle")
        .textContent = titles[page][1];

    document.getElementById("content")
        .innerHTML = views[page]();

}


/* =========================================================
   DASHBOARD
========================================================= */

views.dashboard = function(){

    const now = new Date();

    const upcoming =
        db.matches.filter(
            m => new Date(m.datetime) > now
        )
        .sort(
            (a,b) =>
                new Date(a.datetime) -
                new Date(b.datetime)
        );

    const currentMonth =
        new Date().toISOString().slice(0,7);

    const currentStats =
        db.monthlyStats.find(
            x => x.month === currentMonth
        );

    const totalDiamonds =
        currentStats
        ?
        currentStats.totalDiamonds
        :
        db.teams.reduce(
            (sum,t) =>
                sum +
                Number(
                    t.monthlyDiamonds?.[currentMonth] || 0
                ),
            0
        );

    return `

        <div class="grid stats">

            <div class="card stat dashboard-card">
                <div class="label">👥 Teams</div>
                <div class="num">${db.teams.length}</div>
            </div>

            <div class="card stat dashboard-card">
                <div class="label">👤 Créateurs</div>
                <div class="num">${db.creators.length}</div>
            </div>

            <div class="card stat dashboard-card">
                <div class="label">⚔️ Matchs à venir</div>
                <div class="num">${upcoming.length}</div>
            </div>

            <div class="card stat dashboard-card">
                <div class="label">💎 Diamants du mois</div>
                <div class="num">${diamondNumber(totalDiamonds)}</div>
            </div>

        </div>


        <div class="section">

            <h2>Vue rapide</h2>

            <div class="card">

                <div class="quick-info">

                    <div class="info-box">
                        <span class="muted">🏢 Agences adverses</span>
                        <strong>${db.agencies.length}</strong>
                    </div>

                    <div class="info-box">
                        <span class="muted">📋 Candidatures ouvertes</span>
                        <strong>
                            ${
                                db.applications.filter(
                                    a =>
                                        !["Acceptée","Refusée"].includes(a.status)
                                ).length
                            }
                        </strong>
                    </div>

                    <div class="info-box">
                        <span class="muted">📅 Matchs enregistrés</span>
                        <strong>${db.matches.length}</strong>
                    </div>

                </div>

            </div>

        </div>


        <div class="section">

            <h2>Prochains matchs</h2>

            ${matchList(upcoming.slice(0,5))}

        </div>


        <div class="section">

            <h2>Dernières activités</h2>

            <div class="card">

                ${
                    db.matches.length

                    ?

                    `
                    <div class="list">

                        ${
                            db.matches
                            .slice()
                            .sort(
                                (a,b) =>
                                    new Date(b.datetime) -
                                    new Date(a.datetime)
                            )
                            .slice(0,5)
                            .map(
                                m => `

                                    <div class="listitem">

                                        <div class="row">

                                            <div>

                                                <b>
                                                    ${esc(
                                                        m.ourTeamName ||
                                                        team(m.teamId)?.name ||
                                                        "Team"
                                                    )}

function submitTeam(event,id){

        {

            monthlyDiamonds:{}
        };

    t.name =
        document
        .getElementById("tname")
        .value
        .trim();

    t.memberIds =
        [...document.querySelectorAll(".tm:checked")]
        .map(x => x.value);

    t.managerIds =
        [...document.querySelectorAll(".tmgr:checked")]
        .map(x => x.value);

    if(!id){
        db.teams.push(t);
    }

    save();
    closeModal();
    render();

    db.teams =
        db.teams.filter(

    save();
    render();

function previewAvatar(input){

    const file = input.files?.[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(){

        pendingAvatar = reader.result;

        const preview =
            document.getElementById("avatarPreview");

        if(preview){

            preview.innerHTML = `
                <img
                    src="${pendingAvatar}"
                    class="avatar big"
                >
            `;

        }

    };

    reader.readAsDataURL(file);

}


function submitCreator(event,id){

    event.preventDefault();

    const c =
        id
        ? creator(id)
        :
        {
            id:uid()
        };

    c.name =
        document.getElementById("cname").value.trim();

    c.username =
        document
        .getElementById("cuser")
        .value
        .trim()
        .replace(/^@/,"");

    c.role =
        document.getElementById("crole").value;

    c.status =
        document.getElementById("cstatus").value;

    c.joinDate =
        document.getElementById("cdate").value;

    c.notes =
        document.getElementById("cnotes").value.trim();

    c.avatar =
        pendingAvatar ||
        c.avatar ||
        "";

    const teamId =
        document.getElementById("cteam").value;

    const managerId =
        document.getElementById("cmanager").value;

    /* Retire le créateur de toutes les Teams */
    db.teams.forEach(
        t => {

            t.memberIds =
                (t.memberIds || [])
                .filter(x => x !== c.id);

        }
    );

    /* L'ajoute à la Team choisie */
    if(teamId){

        const t = team(teamId);

        if(t){

            t.memberIds =
                t.memberIds || [];

            if(!t.memberIds.includes(c.id)){
                t.memberIds.push(c.id);
            }

        }

    }

    /* Retire le créateur de tous les managers */
    db.managers.forEach(
        m => {

            m.creatorIds =
                (m.creatorIds || [])
                .filter(x => x !== c.id);

        }
    );

    /* L'ajoute au manager choisi */
    if(managerId){

        const m = manager(managerId);

        if(m){

            m.creatorIds =
                m.creatorIds || [];

            if(!m.creatorIds.includes(c.id)){
                m.creatorIds.push(c.id);
            }

        }

    }

    if(!id){
        db.creators.push(c);
    }

    pendingAvatar = "";

    save();
    closeModal();
    render();

}


function deleteCreator(id){

    const c = creator(id);

    if(!c) return;

    if(
        !confirm(
            `Supprimer "${c.name}" ?`
        )
    ) return;

    db.creators =
        db.creators.filter(
            x => x.id !== id
        );

    db.teams.forEach(
        t => {
            t.memberIds =
                (t.memberIds || [])
                .filter(x => x !== id);
        }
    );

    db.managers.forEach(
        m => {
            m.creatorIds =
                (m.creatorIds || [])
                .filter(x => x !== id);
        }
    );

    save();
    render();

}

function submitManager(event,id){

    event.preventDefault();

    const m =
        id
        ? manager(id)
        :
        {
            id:uid()
        };

    m.name =
        document.getElementById("mgrname").value.trim();

    m.username =
        document
        .getElementById("mgruser")
        .value
        .trim()
        .replace(/^@/,"");

    m.notes =
        document.getElementById("mgrnotes").value.trim();

    m.creatorIds =
        [...document.querySelectorAll(".mgrcreator:checked")]
        .map(x => x.value);

    if(!id){
        db.managers.push(m);
    }

    save();
    closeModal();
    render();

}


function deleteManager(id){

    const m = manager(id);

    if(!m) return;

    if(
        !confirm(
            `Supprimer le manager "${m.name}" ?`
        )
    ) return;

    db.managers =
        db.managers.filter(
            x => x.id !== id
        );

    db.teams.forEach(
        t => {

            t.managerIds =
                (t.managerIds || [])
                .filter(x => x !== id);

            if(t.managerId === id){
                t.managerId = "";
            }

        }
    );

    save();
    render();

}

        document

        document

    const ids =
        team(teamId)?.memberIds || [];

    const members =
        db.creators.filter(
            c => ids.includes(c.id)
        );

    select.innerHTML =
        `
        <option value="">
            Choisir un créateur...
        </option>
        ` +
        members.map(
            c => `

                    value="${c.id}"

        ).join("");

function selectSavedAgency(){

    if(!select || !input) return;

    const a = agency(select.value);

    if(a){
        input.value = a.name;

function submitMatch(event,id){

    event.preventDefault();

    const m =
        id
        ?
        db.matches.find(
            x => x.id === id
        )
        :
        {
            id:uid()
        };

    const agencyId =
        document
        .getElementById("agencySelect")
        .value;

    const selectedAgency =
        agency(agencyId);

    m.ourAgency =
        document
        .getElementById("ourAgency")
        .value
        .trim()
        ||
        db.settings.agencyName;

    m.teamId =
        document
        .getElementById("mteam")
        .value;

    m.ourTeamName =
        team(m.teamId)?.name || "";

    m.creatorId =
        document
        .getElementById("mcreator")
        .value;

    /*
        POINT IMPORTANT :

        Une agence enregistrée est liée par son ID.
        Les futurs matchs utilisant cette même agence
        alimenteront automatiquement son historique.
    */

    m.agencyId =
        selectedAgency
        ?
        selectedAgency.id
        :
        "";

    m.agencyName =
        document
        .getElementById("agencyName")
        .value
        .trim();

    m.opponentTeam =
        document
        .getElementById("oppTeam")
        .value
        .trim();

    m.opponentName =
        document
        .getElementById("oppName")
        .value
        .trim();

    m.opponentUsername =
        document
        .getElementById("oppUser")
        .value
        .trim()
        .replace(/^@/,"");

    m.theme =
        document
        .getElementById("mtheme")
        .value
        .trim();

    m.participants =
        document
        .getElementById("mparticipants")
        .value
        .trim();

    m.result =
        document
        .getElementById("mresult")
        .value;

    m.winner =
        document
        .getElementById("mwinner")
        .value
        .trim();

    const date =
        document
        .getElementById("mdate")
        .value;

    const time =
        document
        .getElementById("mtime")
        .value;

    m.datetime =
        date + "T" + time;

    if(!id){
        db.matches.push(m);
    }

    save();
    closeModal();
    render();

}

function submitAgency(event,id){

    event.preventDefault();

    const a =
        id
        ? agency(id)
        :
        {
            id:uid()
        };

    const oldName = a.name;

    a.name =
        document
        .getElementById("aname")
        .value
        .trim();

    a.favorite =
        document
        .getElementById("afav")
        .value === "1";

    a.notes =
        document
        .getElementById("anotes")
        .value
        .trim();

    /*
       Si une agence est renommée, les anciens matchs
       liés par nom restent récupérables via agencyId.
    */

    if(!id){
        db.agencies.push(a);
    }

    save();
    closeModal();
    render();

}


function toggleFavorite(id){

    const a = agency(id);

    if(!a) return;

    a.favorite = !a.favorite;

    save();
    render();

function deleteAgency(id){

    const a = agency(id);

    if(!a) return;

    if(
        !confirm(
            `Supprimer l'agence "${a.name}" du carnet ?`
        )
    ) return;

    /*
       Les matchs restent conservés.
       On retire seulement le lien vers le carnet.
    */

    db.matches.forEach(
        m => {

            if(m.agencyId === id){
                m.agencyId = "";
            }

        }
    );

    db.agencies =
        db.agencies.filter(
            x => x.id !== id
        );

    save();
    render();

}

                        total:Number(saved.totalDiamonds || 0)
                    };

                    db.teams.reduce(
                        (sum,t) =>
                            sum +
                            Number(

                            ),

                    );

function getLastMonths(count){

    const result = [];

    const now = new Date();

    for(let i=count-1;i>=0;i--){

        const d =
            new Date(
                now.getFullYear(),
                now.getMonth() - i,
                1
            );

        result.push(
            d.toISOString().slice(0,7)
        );

    }

    return result;

}


function getPreviousMonth(month){

    const d =
        new Date(
            month + "-01T00:00:00"
        );

    d.setMonth(
        d.getMonth() - 1
    );

    return d.toISOString().slice(0,7);

}

function submitMonthlyStats(event){

    event.preventDefault();

    const month =
        document.getElementById("statmonth").value;

    if(!month) return;

    document
    .querySelectorAll(".diamond-input")
    .forEach(
        input => {

            const id =
                input.dataset.team;

            const t = team(id);

            if(!t) return;

            t.monthlyDiamonds =
                t.monthlyDiamonds || {};

            t.monthlyDiamonds[month] =
                Number(input.value || 0);

        }
    );

    const total =
        db.teams.reduce(
            (sum,t) =>
                sum +
                Number(
                    t.monthlyDiamonds?.[month] || 0
                ),
            0
        );

    let stats =
        db.monthlyStats.find(
            x => x.month === month
        );

    if(!stats){

        stats = {
            id:uid(),
            month,
            totalDiamonds:total,
            closed:false
        };

        db.monthlyStats.push(stats);

    }else{

        stats.totalDiamonds = total;

    }

    save();
    closeModal();
    render();

}

                    render();
                "
            >

        </div>


        <div class="actions" style="margin-bottom:16px">

            <button
                class="btn primary"
                onclick="openApplication()"
            >
                ＋ Ajouter une candidature
            </button>

        </div>


        ${
            list.length

            ?

            `
            <div class="grid cards">

                ${
                    list.map(
                        a => `

                            <div class="card">

                                <div class="row">

                                    <div>

                                        <h3 style="margin:0">
                                            ${esc(a.name)}
                                        </h3>

                                        ${
                                            a.username
                                            ?
                                            `
                                            <div class="muted">
                                                @${esc(a.username)}
                                            </div>
                                            `
                                            :
                                            ""
                                        }

                                    </div>

                                    <span class="badge">
                                        ${esc(a.status)}
                                    </span>

                                </div>


                                <div
                                    class="muted"
                                    style="margin-top:15px"
                                >

                                    Candidature :
                                    ${fmtDate(a.date)}

                                </div>


                                ${
                                    a.notes
                                    ?
                                    `
                                    <div
                                        class="card"
                                        style="margin-top:12px"
                                    >
                                        ${esc(a.notes)}
                                    </div>
                                    `
                                    :
                                    ""
                                }


                                <div class="actions" style="margin-top:14px">

                                    <button
                                        class="btn ghost"
                                        onclick="openApplication('${a.id}')"
                                    >
                                        Modifier
                                    </button>

                                    <button
                                        class="btn danger"
                                        onclick="deleteApplication('${a.id}')"
                                    >
                                        Supprimer
                                    </button>

                                </div>

                            </div>

                        `
                    ).join("")
                }

            </div>
            `

            :

            `
            <div class="empty">
                ${
                    db.applications.length
                    ?
                    "Aucune candidature ne correspond à votre recherche."
                    :
                    "Aucune candidature enregistrée."
                }
            </div>
            `

        }

    `;

};


function openApplication(id){

    const a =
        id
        ?
        db.applications.find(
            x => x.id === id
        )
        :
        {
            name:"",
            username:"",
            date:"",
            status:"Nouvelle",
            notes:""
        };

    openModal(

        id
        ? "Modifier la candidature"
        : "Ajouter une candidature",

        `

        <form onsubmit="submitApplication(event,'${id || ""}')">

            <div class="formgrid">

                <div class="field">

                    <label>Nom *</label>

                    <input
                        id="appname"
                        required
                        value="${esc(a.name)}"
                    >

                </div>


                <div class="field">

                    <label>Pseudo TikTok</label>

                    <input
                        id="appuser"
                        value="${esc(a.username || "")}"
                    >

                </div>


                <div class="field">

                    <label>Date</label>

                    <input
                        id="appdate"
                        type="date"
                        value="${esc(a.date || "")}"
                    >

                </div>


                <div class="field">

                    <label>Statut</label>

                    <select id="appstatus">

                        ${
                            [
                                "Nouvelle",
                                "À contacter",
                                "Entretien",
                                "En attente",
                                "Acceptée",
                                "Refusée"
                            ]
                            .map(
                                s => `
                                    <option
                                        value="${s}"
                                        ${
                                            a.status === s
                                            ? "selected"
                                            : ""
                                        }
                                    >
                                        ${s}
                                    </option>
                                `
                            )
                            .join("")
                        }

                    </select>

                </div>


                <div class="field full">

                    <label>Notes</label>

                    <textarea id="appnotes">${esc(a.notes || "")}</textarea>

                </div>

            </div>


            <div class="actions" style="margin-top:18px">

                <button class="btn primary">
                    Enregistrer
                </button>

                <button
                    type="button"
                    class="btn ghost"
                    onclick="closeModal()"
                >
                    Annuler
                </button>

            </div>

        </form>

        `

    );

}


function submitApplication(event,id){

    event.preventDefault();

    const a =
        id
        ?
        db.applications.find(
            x => x.id === id
        )
        :
        {
            id:uid()
        };

    a.name =
        document.getElementById("appname").value.trim();

    a.username =
        document
        .getElementById("appuser")
        .value
        .trim()
        .replace(/^@/,"");

    a.date =
        document.getElementById("appdate").value;

    a.status =
        document.getElementById("appstatus").value;

    a.notes =
        document.getElementById("appnotes").value.trim();

    if(!id){
        db.applications.push(a);
    }

    save();
    closeModal();
    render();

}


function deleteApplication(id){

    if(
        !confirm(
            "Supprimer cette candidature ?"
        )
    ) return;

    db.applications =
        db.applications.filter(
            x => x.id !== id
        );

    save();
    render();

}

/* =========================================================
   PARAMÈTRES
========================================================= */

views.settings = function(){

    return `

        <div class="grid cards">

            <div class="card">

                <h3 style="margin-top:0">
                    ⚙️ Informations de l'agence
                </h3>

                <form onsubmit="saveSettings(event)">

                    <div class="field">

                        <label>Nom de l'agence</label>

                        <input
                            id="agencySetting"
                            value="${esc(
                                db.settings.agencyName
                            )}"
                        >

                    </div>


                    <div class="actions" style="margin-top:15px">

                        <button class="btn primary">
                            Enregistrer
                        </button>

                    </div>

                </form>

            </div>


            <div class="card">

                <h3 style="margin-top:0">
                    💾 Sauvegarde
                </h3>

                <p class="muted">
                    Les données sont conservées dans le navigateur.
                    Utilisez l'export pour créer une sauvegarde
                    indépendante.
                </p>


                <div class="actions">

                    <button
                        class="btn primary"
                        onclick="exportData()"
                    >
                        ⬇️ Exporter les données
                    </button>

                    <button
                        class="btn secondary"
                        onclick="document.getElementById('importFile').click()"
                    >
                        ⬆️ Importer une sauvegarde
                    </button>

                    <input
                        id="importFile"
                        type="file"
                        accept=".json,application/json"
                        style="display:none"
                        onchange="importData(this)"
                    >

                </div>

            </div>


            <div class="card">

                <h3 style="margin-top:0">
                    🧹 Réinitialisation
                </h3>

                <p class="muted">
                    Cette action supprime toutes les données
                    enregistrées dans TokCenter sur ce navigateur.
                </p>

                <button
                    class="btn danger"
                    onclick="resetData()"
                >
                    Réinitialiser TokCenter
                </button>

            </div>

        </div>

    `;

};


function saveSettings(event){

    event.preventDefault();

    db.settings.agencyName =
        document
        .getElementById("agencySetting")
        .value
        .trim()
        ||
        "LVF — La Vraie Famille";

    save();

    alert("Paramètres enregistrés.");

    render();

}


function exportData(){

    const data =
        JSON.stringify(
            db,
            null,
            2
        );

    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "tokcenter-sauvegarde-" +
        new Date()
        .toISOString()
        .slice(0,10) +
        ".json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


function importData(input){

    const file =
        input.files?.[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = function(){

        try{

            const imported =
                JSON.parse(reader.result);

            if(
                !imported ||
                typeof imported !== "object"
            ){
                throw new Error();
            }

            if(
                !confirm(
                    "Importer cette sauvegarde remplacera les données actuelles. Continuer ?"
                )
            ){
                input.value = "";
                return;
            }

            db = {
                ...structuredClone(defaultDB),
                ...imported,
                creators:imported.creators || [],
                teams:imported.teams || [],
                managers:imported.managers || [],
                matches:imported.matches || [],
                agencies:imported.agencies || [],
                applications:imported.applications || [],
                monthlyStats:imported.monthlyStats || [],
                settings:{
                    ...defaultDB.settings,
                    ...(imported.settings || {})
                }
            };

            save();

            alert(
                "Sauvegarde importée avec succès."
            );

            render();

        }catch(e){

            alert(
                "Impossible d'importer cette sauvegarde."
            );

        }

        input.value = "";

    };

    reader.readAsText(file);

}


function resetData(){

    if(
        !confirm(
            "ATTENTION : toutes les données de TokCenter seront supprimées. Continuer ?"
        )
    ) return;

    if(
        !confirm(
            "Dernière confirmation : supprimer définitivement toutes les données ?"
        )
    ) return;

    db =
        structuredClone(defaultDB);

    save();

    page = "dashboard";

    renderNav();
    render();

}


/* =========================================================
   MODALE
========================================================= */

function openModal(title,body){

    document
    .getElementById("modalTitle")
    .textContent = title;

    document
    .getElementById("modalBody")
    .innerHTML = body;

    document
    .getElementById("modal")
    .classList.add("open");

}


function closeModal(){

    document
    .getElementById("modal")
    .classList.remove("open");

}


/* =========================================================
   FERMETURE MODALE
========================================================= */

document
.getElementById("modal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target.id === "modal"
        ){
            closeModal();
        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){
            closeModal();
        }

    }
);


/* =========================================================
   INITIALISATION
========================================================= */

renderNav();
render();

</script>
