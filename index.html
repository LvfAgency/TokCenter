<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TokCenter — Gestion d'agence</title>

<style>
:root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --danger:#dc2626;
    --success:#059669;
    --shadow:0 10px 30px rgba(17,24,39,.08);
    --radius:18px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */

.sidebar{
    width:250px;
    background:#111827;
    color:white;
    padding:22px 16px;
    position:fixed;
    inset:0 auto 0 0;
    z-index:20;
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
    padding:8px 12px 24px;
}

.logo span{
    color:#a78bfa;
}

.nav{
    display:grid;
    gap:7px;
}

.nav button{
    background:transparent;
    color:#d1d5db;
    text-align:left;
    padding:13px 14px;
    border-radius:12px;
    font-weight:700;
}

.nav button:hover,
.nav button.active{
    background:#312e81;
    color:white;
}

/* MAIN */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:28px;
    max-width:1500px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:30px;
}

.title p{
    margin:5px 0 0;
    color:var(--muted);
}

/* BUTTONS */

.btn{
    padding:11px 16px;
    border-radius:11px;
    font-weight:800;
}

.primary{
    background:var(--primary);
    color:white;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#eef2ff;
    color:#4338ca;
}

.danger{
    background:#fee2e2;
    color:#991b1b;
}

.ghost{
    background:#f3f4f6;
    color:#374151;
}

/* CARDS */

.grid{
    display:grid;
    gap:18px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.cards{
    grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
}

.stat .label{
    color:var(--muted);
    font-weight:700;
}

.stat .num{
    font-size:32px;
    font-weight:900;
    margin-top:8px;
}

.section{
    margin-top:24px;
}

.section h2{
    font-size:19px;
    margin:0 0 13px;
}

.empty{
    padding:35px;
    text-align:center;
    color:var(--muted);
    background:white;
    border:1px dashed #d1d5db;
    border-radius:16px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    background:#ede9fe;
    color:#5b21b6;
    font-size:12px;
    font-weight:800;
}

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#ede9fe;
    display:grid;
    place-items:center;
    font-weight:900;
    color:#5b21b6;
    flex:none;
}

.avatar.big{
    width:82px;
    height:82px;
    font-size:28px;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
}

.muted{
    color:var(--muted);
    font-size:14px;
}

.small{
    font-size:12px;
}

/* SEARCH */

.search{
    margin-bottom:16px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
}

/* TEAMS */

.teamhead{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.teamicon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:#111827;
    color:white;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:20px;
}

/* LIST */

.list{
    display:grid;
    gap:10px;
}

.listitem{
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px;
    background:#fafafa;
}

/* MATCH */

.match{
    border-left:5px solid var(--primary);
}

.match .date{
    font-weight:900;
}

.vs{
    font-size:17px;
    font-weight:900;
}

.status{
    font-size:12px;
    font-weight:900;
}

.upcoming{
    color:#2563eb;
}

.done{
    color:#059669;
}

/* FAVORITE */

.favorite{
    background:#fffbeb;
}

.star{
    color:#f59e0b;
    background:#fff7ed;
    font-size:18px;
}

/* NOTICE */

.notice{
    padding:12px 14px;
    background:#f5f3ff;
    border-radius:12px;
    color:#4c1d95;
    margin-bottom:14px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.58);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
}

.modal.open{
    display:flex;
}

.modalbox{
    background:white;
    border-radius:20px;
    width:min(680px,100%);
    max-height:92vh;
    overflow:auto;
    padding:24px;
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modalhead h2{
    margin:0;
}

.close{
    background:#f3f4f6;
    border-radius:10px;
    padding:8px 11px;
}

/* FORMS */

.formgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    display:grid;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:800;
    font-size:13px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:11px;
    background:white;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.file{
    border:1px dashed #c4b5fd;
    background:#faf5ff;
    padding:14px;
    border-radius:12px;
}

.preview{
    margin-top:8px;
}

hr{
    border:0;
    border-top:1px solid var(--line);
    margin:18px 0;
}

/* TABS */

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-bottom:18px;
}

.tab{
    background:#e5e7eb;
    padding:10px 15px;
    border-radius:10px;
    font-weight:800;
    white-space:nowrap;
}

.tab.active{
    background:#111827;
    color:white;
}

/* RESPONSIVE */

@media(max-width:900px){

    .sidebar{
        width:76px;
        padding:15px 10px;
    }

    .logo{
        font-size:0;
        text-align:center;
    }

    .logo:after{
        content:"TC";
        font-size:21px;
    }

    .nav button{
        font-size:0;
        text-align:center;
    }

    .nav button:before{
        content:"•";
        font-size:22px;
    }

    .main{
        margin-left:76px;
        width:calc(100% - 76px);
        padding:18px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .formgrid{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        Tok<span>Center</span>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>

<main class="main">

    <div class="topbar">

        <div class="title">
            <h1 id="pageTitle">Tableau de bord</h1>
            <p id="pageSubtitle">
                Votre centre de gestion d'agence.
            </p>
        </div>

        <button class="btn primary" onclick="openQuickCreate()">
            ＋ Ajouter
        </button>

    </div>

    <div id="content"></div>

</main>

</div>


<!-- MODALE -->

<div class="modal" id="modal">

    <div class="modalbox">

        <div class="modalhead">

            <h2 id="modalTitle"></h2>

            <button class="close" onclick="closeModal()">
                ✕
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>


<script>

/* =========================================================
   BASE DE DONNÉES LOCALE
========================================================= */

const STORAGE_KEY = "tokcenter_v5";

let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {

    creators: [],
    teams: [],
    matches: [],
    agencies: [],

    settings: {
        agencyName: "LVF Agency"
    }

};

let page = "dashboard";
let pendingAvatar = "";


/* =========================================================
   OUTILS
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

}


function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2,8);

}


function esc(value=""){

    return String(value).replace(
        /[&<>"']/g,
        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


function fmtDate(value){

    if(!value) return "—";

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function fmtDT(value){

    if(!value) return "—";

    const date = new Date(value);

    return date.toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ) +
    " à " +
    date.toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function initials(name){

    return (name || "?")
        .split(/\s+/)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}


function avatar(creator,big=false){

    if(
        creator &&
        creator.avatar
    ){

        return `
            <img
                class="avatar ${big ? "big" : ""}"
                src="${creator.avatar}"
                alt=""
            >
        `;

    }

    return `
        <div class="avatar ${big ? "big" : ""}">
            ${esc(initials(creator?.name || "?"))}
        </div>
    `;

}


function roleBadge(role){

    return `
        <span class="badge">
            ${esc(role || "Créateur")}
        </span>
    `;

}


function creator(id){

    return db.creators.find(
        x => x.id === id
    );

}


function team(id){

    return db.teams.find(
        x => x.id === id
    );

}


function agency(id){

    return db.agencies.find(
        x => x.id === id
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

const navItems = [

    ["dashboard","🏠","Tableau de bord"],
    ["teams","👥","Teams"],
    ["creators","👤","Créateurs"],
    ["matches","⚔️","Matchs"],
    ["agencies","🏢","Agences"],
    ["calendar","📅","Calendrier"]

];


function renderNav(){

    document.getElementById("nav").innerHTML =
        navItems.map(item => `

            <button
                class="${page === item[0] ? "active" : ""}"
                onclick="go('${item[0]}')"
            >

                ${item[1]}
                <span>${item[2]}</span>

            </button>

        `).join("");

}


function go(newPage){

    page = newPage;

    renderNav();

    render();

}


/* =========================================================
   RENDU PRINCIPAL
========================================================= */

function render(){

    const titles = {

        dashboard:[
            "Tableau de bord",
            "Vue d'ensemble de TokCenter."
        ],

        teams:[
            "Teams",
            "Gérez vos équipes et leurs créateurs."
        ],

        creators:[
            "Créateurs",
            "Vos membres, leurs rôles et leurs informations."
        ],

        matches:[
            "Matchs",
            "Planifiez et consultez vos matchs TikTok."
        ],

        agencies:[
            "Agences adverses",
            "Votre carnet d'agences enregistré manuellement."
        ],

        calendar:[
            "Calendrier",
            "Vos matchs classés par date."
        ]

    };

    document.getElementById("pageTitle")
        .textContent = titles[page][0];

    document.getElementById("pageSubtitle")
        .textContent = titles[page][1];

    document.getElementById("content")
        .innerHTML = views[page]();

}


/* =========================================================
   TABLEAU DE BORD
========================================================= */

const views = {};


views.dashboard = function(){

    const upcoming = db.matches
        .filter(
            m => new Date(m.datetime) > new Date()
        )
        .sort(
            (a,b) =>
                new Date(a.datetime) -
                new Date(b.datetime)
        );

    return `

        <div class="grid stats">

            <div class="card stat">
                <div class="label">Teams</div>
                <div class="num">
                    ${db.teams.length}
                </div>
            </div>

            <div class="card stat">
                <div class="label">Créateurs</div>
                <div class="num">
                    ${db.creators.length}
                </div>
            </div>

            <div class="card stat">
                <div class="label">Matchs à venir</div>
                <div class="num">
                    ${upcoming.length}
                </div>
            </div>

            <div class="card stat">
                <div class="label">
                    Agences enregistrées
                </div>
                <div class="num">
                    ${db.agencies.length}
                </div>
            </div>

        </div>


        <div class="section">

            <h2>
                Prochains matchs
            </h2>

            ${
                matchList(
                    upcoming.slice(0,4)
                )
            }

        </div>


        <div class="section">

            <h2>
                Activité récente
            </h2>

            <div class="card">

                ${
                    db.matches.length

                    ?

                    `
                    <div class="list">

                        ${
                            db.matches
                            .slice()
                            .sort(
                                (a,b) =>
                                    new Date(b.datetime) -
                                    new Date(a.datetime)
                            )
                            .slice(0,5)
                            .map(m => `

                                <div class="listitem">

                                    <div class="row">

                                        <div>

                                            <b>
                                                ${esc(
                                                    m.ourTeamName ||
                                                    team(m.teamId)?.name ||
                                                    "Team"
                                                )}
                                            </b>

                                            vs

                                            <b>
                                                ${esc(
                                                    m.agencyName ||
                                                    "Agence adverse"
                                                )}
                                            </b>

                                        </div>

                                        <span class="muted">
                                            ${fmtDT(m.datetime)}
                                        </span>

                                    </div>

                                </div>

                            `)
                            .join("")

                        }

                    </div>
                    `

                    :

                    `
                    <div class="empty">
                        Aucune activité pour le moment.
                    </div>
                    `

                }

            </div>

        </div>

    `;

};


/* =========================================================
   CRÉATEURS
========================================================= */

views.creators = function(){

    const q =
        (window.creatorSearch || "")
        .toLowerCase();

    const creators =
        db.creators.filter(c =>

            (
                c.name +
                " " +
                c.username +
                " " +
                c.role
            )
            .toLowerCase()
            .includes(q)

        );


    return `

        <div class="search">

            <input
                placeholder="🔎 Rechercher un créateur..."
                value="${esc(window.creatorSearch || "")}"
                oninput="
                    window.creatorSearch=this.value;
                    render();
                "
            >

        </div>


        <div
            class="actions"
            style="margin-bottom:16px"
        >

            <button
                class="btn primary"
                onclick="openCreator()"
            >
                ＋ Ajouter un créateur
            </button>

        </div>


        ${
            creators.length

            ?

            `
            <div class="grid cards">

                ${
                    creators.map(c => `

                        <div class="card">

                            <div class="row">

                                <div class="person">

                                    ${avatar(c)}

                                    <div>

                                        <b>
                                            ${esc(c.name)}
                                        </b>

                                        <div class="muted">
                                            @${esc(c.username)}
                                        </div>

                                    </div>

                                </div>

                                ${roleBadge(c.role)}

                            </div>


                            <div
                                class="muted"
                                style="margin-top:14px"
                            >

                                ${
                                    c.joinDate
                                    ? "Arrivé le " +
                                      fmtDate(c.joinDate)
                                    : "Date d'arrivée non renseignée"
                                }

                                ·

                                ${
                                    db.teams
                                    .filter(
                                        t =>
                                            t.memberIds?.includes(c.id)
                                    )
                                    .map(
                                        t => esc(t.name)
                                    )
                                    .join(", ")
                                    ||
                                    "Aucune team"
                                }

                            </div>


                            <div
                                class="actions"
                                style="margin-top:14px"
                            >

                                <button
                                    class="btn secondary"
                                    onclick="
                                        creatorDetails('${c.id}')
                                    "
                                >
                                    Voir la fiche
                                </button>

                                <button
                                    class="btn ghost"
                                    onclick="
                                        openCreator('${c.id}')
                                    "
                                >
                                    Modifier
                                </button>

                            </div>

                        </div>

                    `).join("")

                }

            </div>
            `

            :

            `
            <div class="empty">

                Aucun créateur.
                Ajoutez votre premier membre.

            </div>
            `

        }

    `;

};


/* =========================================================
   TEAMS
========================================================= */

views.teams = function(){

    return `

        <div
            class="actions"
            style="margin-bottom:16px"
        >

            <button
                class="btn primary"
                onclick="openTeam()"
            >
                ＋ Créer une team
            </button>

        </div>


        ${
            db.teams.length

            ?

            `
            <div class="grid cards">

                ${
                    db.teams.map(t => {

                        const members =
                            db.creators.filter(
                                c =>
                                    t.memberIds?.includes(c.id)
                            );

                        return `

                            <div class="card">

                                <div class="teamhead">

                                    <div class="teamicon">
                                        ${esc(
                                            initials(t.name)
                                        )}
                                    </div>

                                    <div>

                                        <h3 style="margin:0">
                                            ${esc(t.name)}
                                        </h3>

                                        <span class="muted">
                                            ${members.length}
                                            créateur${members.length > 1 ? "s" : ""}
                                        </span>

                                    </div>

                                </div>


                                <div class="list">

                                    ${
                                        members.length

                                        ?

                                        members.map(c => `

                                            <div class="person">

                                                ${avatar(c)}

                                                <div>

                                                    <b>
                                                        ${esc(c.name)}
                                                    </b>

                                                    <div class="muted">

                                                        @${esc(c.username)}
                                                        ·
                                                        ${esc(c.role)}

                                                    </div>

                                                </div>

                                            </div>

                                        `).join("")

                                        :

                                        `
                                        <div class="muted">
                                            Aucun membre.
                                        </div>
                                        `

                                    }

                                </div>


                                <div
                                    class="actions"
                                    style="margin-top:15px"
                                >

                                    <button
                                        class="btn secondary"
                                        onclick="
                                            teamDetails('${t.id}')
                                        "
                                    >
                                        Ouvrir
                                    </button>

                                    <button
                                        class="btn ghost"
                                        onclick="
                                            openTeam('${t.id}')
                                        "
                                    >
                                        Modifier
                                    </button>

                                </div>

                            </div>

                        `;

                    }).join("")

                }

            </div>
            `

            :

            `
            <div class="empty">
                Aucune team créée.
            </div>
            `

        }

    `;

};


/* =========================================================
   MATCHS
========================================================= */

views.matches = function(){

    return `

        <div
            class="actions"
            style="margin-bottom:16px"
        >

            <button
                class="btn primary"
                onclick="openMatch()"
            >
                ＋ Créer un match
            </button>

        </div>


        <div class="tabs">

            <button class="tab active">
                Tous (${db.matches.length})
            </button>

            <button class="tab">
                À venir
                (${
                    db.matches.filter(
                        m =>
                            new Date(m.datetime) > new Date()
                    ).length
                })
            </button>

            <button class="tab">
                Terminés
                (${
                    db.matches.filter(
                        m =>
                            new Date(m.datetime) <= new Date()
                    ).length
                })
            </button>

        </div>


        ${
            matchList(
                db.matches
                .slice()
                .sort(
                    (a,b) =>
                        new Date(a.datetime) -
                        new Date(b.datetime)
                )
            )
        }

    `;

};


function matchList(matches){

    if(!matches.length){

        return `
            <div class="empty">
                Aucun match enregistré.
            </div>

function previewAvatar(input){

    const file = input.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload = function(){

        pendingAvatar =
            reader.result;


        document.getElementById(
            "avatarPreview"
        ).innerHTML = `

            <img
                src="${pendingAvatar}"
                class="avatar big"
            >

        `;

    };


    reader.readAsDataURL(file);

}


function submitCreator(event,id){

    event.preventDefault();


    const c =
        id
        ? creator(id)
        : {
            id:uid()
        };


    c.name =
        document.getElementById(
            "cname"
        ).value.trim();


    c.username =
        document.getElementById(
            "cuser"
        ).value
        .trim()
        .replace(/^@/,"");


    c.role =
        document.getElementById(
            "crole"
        ).value;


    c.joinDate =
        document.getElementById(
            "cdate"
        ).value;


    c.avatar =
        pendingAvatar ||
        c.avatar ||
        "";


    if(!id){

        db.creators.push(c);

    }


    pendingAvatar = "";

    save();

    closeModal();

    render();

}

                "LVF Agency",

            teamId:"",
            creatorId:"",
            agencyId:"",
            agencyName:"",
            opponentTeam:"",
            opponentName:"",
            opponentUsername:"",
            datetime:""
        };


    const savedAgencies =
        db.agencies
        .slice()
        .sort(
            (a,b) =>
                Number(b.favorite) -
                Number(a.favorite)
        );


    openModal(

        id
        ? "Modifier le match"
        : "Créer un match",

        `

        <form
            onsubmit="
                submitMatch(event,'${id || ""}')
            "
        >

            <div class="formgrid">


                <div class="field">

                    <label>
                        Notre agence
                    </label>

                    <input
                        id="ourAgency"
                        value="${esc(
                            m.ourAgency ||
                            db.settings.agencyName ||
                            "LVF Agency"
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        Notre team *
                    </label>

                    <select
                        id="mteam"
                        required
                        onchange="fillCreators()"
                    >

                        <option value="">
                            Choisir une team...
                        </option>

                        ${
                            db.teams.map(t => `

                                <option
                                    value="${t.id}"
                                    ${
                                        m.teamId === t.id
                                        ? "selected"
                                        : ""
                                    }
                                >
                                    ${esc(t.name)}
                                </option>

                            `).join("")

                        }

                    </select>

                </div>


                <div class="field">

                    <label>
                        Notre créateur *
                    </label>

                    <select
                        id="mcreator"
                        required
                    >

                        <option value="">
                            Choisir après la team...
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Agence adverse
                    </label>


                    <div class="actions">

                        <select
                            id="agencySelect"
                            style="flex:1"
                            onchange="selectSavedAgency()"
                        >

                            <option value="">
                                ✏️ Écrire une agence / choisir...
                            </option>

                            ${
                                savedAgencies.map(a => `

                                    <option
                                        value="${a.id}"
                                        ${
                                            m.agencyId === a.id
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        ${
                                            a.favorite
                                            ? "⭐ "
                                            : ""
                                        }

                                        ${esc(a.name)}

                                    </option>

                                `).join("")

                            }

                        </select>


                        <button
                            type="button"
                            class="btn secondary"
                            onclick="openAgency()"
                        >
                            ＋ Enregistrer une agence
                        </button>

                    </div>


                    <input
                        id="agencyName"
                        style="margin-top:8px"
                        placeholder="Nom de l'agence adverse (saisie libre)"
                        value="${esc(
                            m.agencyName || ""
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        Team adverse
                    </label>

                    <input
                        id="oppTeam"
                        value="${esc(
                            m.opponentTeam || ""
                        )}"
                        placeholder="Ex. Team Predator"
                    >

                </div>


                <div class="field">

                    <label>
                        Nom de l'adversaire
                    </label>

                    <input
                        id="oppName"
                        value="${esc(
                            m.opponentName || ""
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        Pseudo de l'adversaire
                    </label>

                    <input
                        id="oppUser"
                        value="${esc(
                            m.opponentUsername || ""
                        )}"
                        placeholder="@pseudo"
                    >

                </div>


                <div class="field">

                    <label>
                        Date *
                    </label>

                    <input
                        id="mdate"
                        type="date"
                        required
                        value="${
                            m.datetime
                            ? m.datetime.slice(0,10)
                            : ""
                        }"
                    >

                </div>


                <div class="field">

                    <label>
                        Heure *
                    </label>

                    <input
                        id="mtime"
                        type="time"
                        required
                        value="${
                            m.datetime
                            ? m.datetime.slice(11,16)
                            : ""
                        }"
                    >

                </div>


            </div>


            <div
                class="notice"
                style="margin-top:14px"
            >

                Une agence sélectionnée ici est réutilisée.

                Une agence écrite manuellement n'est
                <b>pas</b> enregistrée automatiquement.

            </div>


            <div class="actions">

                <button
                    class="btn primary"
                >
                    Enregistrer le match
                </button>


                <button
                    type="button"
                    class="btn ghost"
                    onclick="closeModal()"
                >
                    Annuler
                </button>

            </div>

        </form>

        `

    );


    setTimeout(
        () => {

            fillCreators(
                m.creatorId || ""
            );

            selectSavedAgency();

        },
        0
    );

}


/* =========================================================
   CRÉATEURS D'UNE TEAM
========================================================= */

function fillCreators(selected=""){

    const teamId =
        document.getElementById(
            "mteam"
        )?.value;


    const select =
        document.getElementById(
            "mcreator"
        );


    if(!select) return;


    const ids =
        team(teamId)
        ?.memberIds ||
        [];


    select.innerHTML =

        `
        <option value="">
            Choisir un créateur...
        </option>
        `

        +

        db.creators
        .filter(
            c =>
                ids.includes(c.id)
        )
        .map(c => `

            <option
                value="${c.id}"
                ${
                    c.id === selected
                    ? "selected"
                    : ""
                }
            >

                ${esc(c.name)}
                —
                @${esc(c.username)}

            </option>

        `)
        .join("");

}


/* =========================================================
   AGENCE ENREGISTRÉE
========================================================= */

function selectSavedAgency(){

    const select =
        document.getElementById(
            "agencySelect"
        );


    const input =
        document.getElementById(
            "agencyName"
        );


    if(!select || !input) return;


    const selectedAgency =
        agency(select.value);


    if(selectedAgency){

        input.value =
            selectedAgency.name;

    }

}


/* =========================================================
   ENREGISTREMENT MATCH
========================================================= */

function submitMatch(event,id){

    event.preventDefault();


    const m =
        id
        ? db.matches.find(
            x => x.id === id
        )
        :
        {
            id:uid()
        };


    const agencyId =
        document.getElementById(
            "agencySelect"
        ).value;


    const selectedAgency =
        agency(agencyId);


    m.ourAgency =
        document.getElementById(
            "ourAgency"
        ).value.trim()
        ||
        "LVF Agency";


    m.teamId =
        document.getElementById(
            "mteam"
        ).value;


    m.ourTeamName =
        team(m.teamId)
        ?.name ||
        "";


    m.creatorId =
        document.getElementById(
            "mcreator"
        ).value;


    /*
       IMPORTANT :
       L'agence n'est liée à la base enregistrée
       que si elle a réellement été sélectionnée
       dans la liste des agences enregistrées.
    */

    m.agencyId =
        selectedAgency
        ? selectedAgency.id
        : "";


    m.agencyName =
        document.getElementById(
            "agencyName"
        ).value.trim();


    m.opponentTeam =
        document.getElementById(
            "oppTeam"
        ).value.trim();


    m.opponentName =
        document.getElementById(
            "oppName"
        ).value.trim();


    m.opponentUsername =
        document.getElementById(
            "oppUser"
        ).value
        .trim()
        .replace(/^@/,"");


    const date =
        document.getElementById(
            "mdate"
        ).value;


    const time =
        document.getElementById(
            "mtime"
        ).value;


    m.datetime =
        date +
        "T" +
        time;


    if(!id){

        db.matches.push(m);

    }


    save();

    closeModal();

    render();

}


/* =========================================================
   DÉTAILS MATCH
========================================================= */

function matchDetails(id){

    const m =
        db.matches.find(
            x => x.id === id
        );


    const c =
        creator(m.creatorId);


    openModal(

        "Détails du match",

        `

        <div class="card">

            <div class="muted">
                ${fmtDT(m.datetime)}
            </div>


            <h2>

                ${esc(m.ourAgency)}

                ·

                ${esc(m.ourTeamName)}

            </h2>


            <div class="person">

                ${
                    c
                    ? avatar(c)
                    : ""
                }


                <div>

                    <b>
                        ${
                            c
                            ? esc(c.name)
                            : "—"
                        }
                    </b>

                    <div class="muted">

                        ${
                            c
                            ? "@" + esc(c.username)
                            : ""
                        }

                    </div>

                </div>

            </div>


            <hr>


            <div class="muted">
                AGENCE ADVERSE
            </div>


            <h2>

                ${esc(
                    m.agencyName ||
                    "—"
                )}

                ·

                ${esc(
                    m.opponentTeam ||
                    "—"
                )}

            </h2>


            <div>

                <b>
                    ${esc(
                        m.opponentName ||
                        "—"
                    )}
                </b>


                ${
                    m.opponentUsername

                    ?

                    `
                    <span class="muted">
                        (@${esc(
                            m.opponentUsername
                        )})
                    </span>
                    `

                    :

                    ""
                }

            </div>

        </div>


        <div
            class="actions"
            style="margin-top:14px"
        >

            <button
                class="btn ghost"
                onclick="
                    openMatch('${id}')
                "
            >
                Modifier
            </button>


            <button
                class="btn danger"
                onclick="
                    deleteMatch('${id}')
                "
            >
                Supprimer
            </button>

        </div>

        `

    );

}


/* =========================================================
   SUPPRESSION MATCH
========================================================= */

function deleteMatch(id){

    if(
        !confirm(
            "Supprimer ce match ?"
        )
    ){

        return;

    }


    db.matches =
        db.matches.filter(
            m =>
                m.id !== id
        );


    save();

    closeModal();

    render();

}


/* =========================================================
   FERMETURE MODALE
========================================================= */

document
    .getElementById("modal")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target.id === "modal"
            ){

                closeModal();

            }

        }
    );


/* =========================================================
   INITIALISATION
========================================================= */

render();

</script>

</body>
</html>
