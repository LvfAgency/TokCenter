<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TokCenter — LVF</title>

<style>
:root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --primary-soft:#ede9fe;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --success:#059669;
    --blue:#2563eb;
    --orange:#f59e0b;
    --shadow:0 10px 30px rgba(17,24,39,.08);
    --radius:18px;
}

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    min-height:100vh;
    display:flex;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:250px;
    background:linear-gradient(180deg,#111827 0%,#171b2e 100%);
    color:white;
    padding:18px 12px;
    position:fixed;
    inset:0 auto 0 0;
    z-index:50;
    box-shadow:8px 0 25px rgba(0,0,0,.08);
    overflow-y:auto;
}

.logo{
    padding:8px 12px 25px;
    font-size:28px;
    font-weight:950;
    letter-spacing:-1.5px;
}

.logo .tok{
    color:white;
}

.logo .center{
    color:#a78bfa;
}

.logo-sub{
    display:block;
    font-size:10px;
    letter-spacing:1.4px;
    color:#9ca3af;
    text-transform:uppercase;
    margin-top:5px;
    font-weight:700;
}

.nav{
    display:grid;
    gap:6px;
}

.nav button{
    width:100%;
    display:flex;
    align-items:center;
    gap:13px;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:12px 13px;
    border-radius:13px;
    font-weight:800;
    transition:.18s;
}

.nav button:hover{
    background:rgba(124,58,237,.18);
    color:white;
}

.nav button.active{
    background:linear-gradient(135deg,#6d28d9,#7c3aed);
    color:white;
    box-shadow:0 7px 18px rgba(124,58,237,.28);
}

.nav-icon{
    width:27px;
    min-width:27px;
    height:27px;
    display:grid;
    place-items:center;
    font-size:18px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    margin-left:250px;
    width:calc(100% - 250px);
    padding:28px;
    max-width:1650px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:30px;
    letter-spacing:-.7px;
}

.title p{
    margin:5px 0 0;
    color:var(--muted);
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    padding:11px 16px;
    border-radius:11px;
    font-weight:850;
    transition:.15s;
}

.btn:hover{
    transform:translateY(-1px);
}

.primary{
    background:var(--primary);
    color:white;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#eef2ff;
    color:#4338ca;
}

.ghost{
    background:#f3f4f6;
    color:#374151;
}

.danger{
    background:var(--danger-soft);
    color:#991b1b;
}

.star{
    background:#fff7ed;
    color:#f59e0b;
    font-size:19px;
}

/* =========================================================
   CARDS
========================================================= */

.grid{
    display:grid;
    gap:18px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.cards{
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
}

.card:hover{
    border-color:#ddd6fe;
}

.stat .label{
    color:var(--muted);
    font-weight:700;
}

.stat .num{
    font-size:32px;
    font-weight:950;
    margin-top:8px;
}

.section{
    margin-top:25px;
}

.section h2{
    font-size:19px;
    margin:0 0 13px;
}

.empty{
    padding:38px;
    text-align:center;
    color:var(--muted);
    background:white;
    border:1px dashed #d1d5db;
    border-radius:16px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    background:var(--primary-soft);
    color:#5b21b6;
    font-size:12px;
    font-weight:850;
}

.muted{
    color:var(--muted);
    font-size:14px;
}

.small{
    font-size:12px;
}

/* =========================================================
   AVATARS
========================================================= */

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#ede9fe;
    display:grid;
    place-items:center;
    font-weight:900;
    color:#5b21b6;
    flex:none;
}

.avatar.big{
    width:82px;
    height:82px;
    font-size:28px;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
}

/* =========================================================
   SEARCH
========================================================= */

.search{
    margin-bottom:16px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
    outline:none;
}

.search input:focus,
.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#a78bfa;
    box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

/* =========================================================
   TEAMS
========================================================= */

.teamhead{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.teamicon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:linear-gradient(135deg,#111827,#312e81);
    color:white;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:20px;
    flex:none;
}

.list{
    display:grid;
    gap:10px;
}

.listitem{
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px;
    background:#fafafa;
}

/* =========================================================
   MATCHS
========================================================= */

.match{
    border-left:5px solid var(--primary);
}

.match .date{
    font-weight:900;
}

.vs{
    font-size:17px;
    font-weight:900;
    line-height:1.45;
}

.status{
    font-size:12px;
    font-weight:900;
}

.upcoming{
    color:var(--blue);
}

.done{
    color:var(--success);
}

.matchoff-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#ede9fe;
    color:#5b21b6;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:900;
}

/* =========================================================
   AGENCES
========================================================= */

.favorite{
    background:#fffdf7;
    border-color:#fde68a;
}

.agency-card{
    position:relative;
    overflow:hidden;
}

.agency-card.favorite::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:#f59e0b;
}

.agency-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:#111827;
    color:white;
    font-weight:950;
    font-size:20px;
    flex:none;
}

.notice{
    padding:13px 15px;
    background:#f5f3ff;
    border:1px solid #ddd6fe;
    border-radius:13px;
    color:#4c1d95;
    margin-bottom:15px;
}

/* =========================================================
   CALENDRIER
========================================================= */

.calendar-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:18px;
}

.calendar-month{
    font-size:21px;
    font-weight:950;
}

.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:10px;
}

.calendar-weekday{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    padding:8px 3px;
}

.calendar-day{
    min-height:145px;
    background:white;
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    overflow:hidden;
}

.calendar-day.empty-day{
    background:#f8fafc;
    opacity:.55;
}

.day-number{
    font-size:13px;
    font-weight:950;
    margin-bottom:7px;
}

.calendar-event{
    width:100%;
    background:#f5f3ff;
    border:1px solid #ddd6fe;
    border-radius:10px;
    padding:9px;
    margin-bottom:7px;
    text-align:left;
    transition:.15s;
}

.calendar-event:hover{
    background:#ede9fe;
    transform:translateY(-1px);
}

.calendar-event .event-title{
    font-size:11px;
    font-weight:950;
    color:#5b21b6;
    margin-bottom:5px;
}

.calendar-event .event-creator{
    font-size:12px;
    font-weight:900;
    line-height:1.25;
}

.calendar-event .event-team{
    font-size:11px;
    color:var(--muted);
    margin-top:3px;
}

.calendar-event .event-time{
    font-size:10px;
    color:#4b5563;
    margin-top:5px;
    font-weight:800;
}

/* =========================================================
   DASHBOARD QUICK CARDS
========================================================= */

.dashboard-card{
    cursor:pointer;
    transition:.15s;
}

.dashboard-card:hover{
    transform:translateY(-2px);
}

.dashboard-icon{
    width:45px;
    height:45px;
    border-radius:13px;
    background:var(--primary-soft);
    display:grid;
    place-items:center;
    font-size:21px;
    margin-bottom:12px;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    backdrop-filter:blur(3px);
}

.modal.open{
    display:flex;
}

.modalbox{
    background:white;
    border-radius:21px;
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:19px;
}

.modalhead h2{
    margin:0;
}

.close{
    background:#f3f4f6;
    border-radius:10px;
    padding:8px 11px;
}

/* =========================================================
   FORMS
========================================================= */

.formgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    display:grid;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:800;
    font-size:13px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:11px;
    background:white;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.file{
    border:1px dashed #c4b5fd;
    background:#faf5ff;
    padding:14px;
    border-radius:12px;
}

.preview{
    margin-top:8px;
}

hr{
    border:0;
    border-top:1px solid var(--line);
    margin:18px 0;
}

/* =========================================================
   DIAMANTS
========================================================= */

.diamond-box{
    background:linear-gradient(135deg,#f5f3ff,#fafafa);
    border:1px solid #ddd6fe;
    border-radius:16px;
    padding:18px;
}

.diamond-value{
    font-size:28px;
    font-weight:950;
}

.month-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:12px;
    background:#fafafa;
}

.rank{
    width:30px;
    height:30px;
    border-radius:9px;
    display:grid;
    place-items:center;
    background:#111827;
    color:white;
    font-weight:900;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1050px){

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .calendar-grid{
        gap:6px;
    }

    .calendar-day{
        min-height:120px;
    }

}

@media(max-width:800px){

    .sidebar{
        width:74px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
        text-align:center;
        padding-left:0;
        padding-right:0;
    }

    .logo:before{
        content:"TC";
        font-size:22px;
    }

    .logo .tok,
    .logo .center,
    .logo-sub,
    .nav button span{
        display:none;
    }

    .nav button{
        justify-content:center;
        padding:13px;
    }

    .nav-icon{
        width:auto;
    }

    .main{
        margin-left:74px;
        width:calc(100% - 74px);
        padding:18px;
    }

    .calendar-grid{
        grid-template-columns:repeat(7,minmax(90px,1fr));
        overflow-x:auto;
    }

    .calendar-wrapper{
        overflow-x:auto;
    }

}

@media(max-width:600px){

    .formgrid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .topbar .btn{
        width:100%;
    }

    .modalbox{
        padding:19px;
    }

    .calendar-toolbar{
        align-items:flex-start;
        flex-direction:column;
    }

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        <span class="tok">Tok</span><span class="center">Center</span>
        <span class="logo-sub">LVF — La Vraie Famille</span>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>


<main class="main">

    <div class="topbar">

        <div class="title">

            <h1 id="pageTitle">
                Tableau de bord
            </h1>

            <p id="pageSubtitle">
                Votre centre de gestion LVF.
            </p>

        </div>

        <!--
            IMPORTANT :
            Le bouton Ajouter global a été volontairement supprimé.
            Chaque ajout se fait dans sa catégorie.
        -->

    </div>

    <div id="content"></div>

</main>

</div>


<div class="modal" id="modal">

    <div class="modalbox">

        <div class="modalhead">

            <h2 id="modalTitle"></h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>


<script>

/* =========================================================
   BASE DE DONNÉES
========================================================= */

const STORAGE_KEY = "tokcenter_v8";

let db =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "null"
    ) ||
    {
        creators:[],
        teams:[],
        matches:[],
        agencies:[],
        monthlyStats:[],
        settings:{
            agencyName:"LVF — La Vraie Famille"
        }
    };


let page = "dashboard";

let pendingAvatar = "";

let creatorSearch = "";

let agencySearch = "";

let calendarDate = new Date();


/* =========================================================
   MIGRATION / COMPATIBILITÉ
========================================================= */

if(!Array.isArray(db.creators))
    db.creators = [];

if(!Array.isArray(db.teams))
    db.teams = [];

if(!Array.isArray(db.matches))
    db.matches = [];

if(!Array.isArray(db.agencies))
    db.agencies = [];

if(!Array.isArray(db.monthlyStats))
    db.monthlyStats = [];

if(!db.settings)
    db.settings = {};

if(!db.settings.agencyName)
    db.settings.agencyName = "LVF — La Vraie Famille";


/* =========================================================
   SAUVEGARDE
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

}


/* =========================================================
   OUTILS
========================================================= */

function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2,9);

}


function esc(value=""){

    return String(value).replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );

}


function fmtDate(value){

    if(!value)
        return "—";

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function fmtDT(value){

    if(!value)
        return "—";

    const d =
        new Date(value);

    return d.toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    )
    +
    " à "
    +
    d.toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function initials(name){

    return (name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}


function creator(id){

    return db.creators.find(
        x => x.id === id
    );

}


function team(id){

    return db.teams.find(
        x => x.id === id
    );

}


function agency(id){

    return db.agencies.find(
        x => x.id === id
    );

}


function avatar(c,big=false){

    if(c && c.avatar){

        return `
            <img
                class="avatar ${big ? "big" : ""}"
                src="${c.avatar}"
                alt=""
            >
        `;

    }

    return `
        <div class="avatar ${big ? "big" : ""}">
            ${esc(initials(c?.name || "?"))}
        </div>
    `;

}


function roleBadge(role){

    return `
        <span class="badge">
            ${esc(role || "Créateur")}
        </span>
    `;

}


function monthKey(date){

    const d =
        date instanceof Date
        ? date
        : new Date(date);

    return d.getFullYear() +
        "-" +
        String(d.getMonth()+1)
        .padStart(2,"0");

}


function monthName(date){

    return date.toLocaleDateString(
        "fr-FR",
        {
            month:"long",
            year:"numeric"
        }
    );

}


function getMatchDate(m){

    return new Date(
        m.datetime
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

const navItems = [

    ["dashboard","🏠","Tableau de bord"],
    ["teams","👥","Teams"],
    ["creators","👤","Créateurs"],
    ["matches","⚔️","Match OFF"],
    ["agencies","🏢","Agences adverses"],
    ["diamonds","💎","Diamants"],
    ["calendar","📅","Calendrier"]

];


function renderNav(){

    document.getElementById("nav").innerHTML =
        navItems.map(
            item => `

                <button
                    class="${page === item[0] ? "active" : ""}"
                    onclick="go('${item[0]}')"
                >

                    <span class="nav-icon">
                        ${item[1]}
                    </span>

                    <span>
                        ${item[2]}
                    </span>

                </button>

            `
        ).join("");

}


function go(newPage){

    page = newPage;

    renderNav();

    render();

}


/* =========================================================
   RENDU PRINCIPAL
========================================================= */

const views = {};


function render(){

    const titles = {

        dashboard:[
            "Tableau de bord",
            "Vue rapide de l'activité de LVF."
        ],

        teams:[
            "Teams",
            "Gérez vos équipes et leurs créateurs."
        ],

        creators:[
            "Créateurs",
            "Gérez les membres de LVF."
        ],

        matches:[
            "Match OFF",
            "Créez et gérez vos Match OFF."
        ],

        agencies:[
            "Agences adverses",
            "Votre carnet d'agences et leur historique."
        ],

        diamonds:[
            "Diamants",
            "Suivez les performances mensuelles de vos Teams."
        ],

        calendar:[
            "Calendrier",
            "Visualisez vos Match OFF rapidement."
        ]

    };

    document.getElementById("pageTitle")
        .textContent = titles[page][0];

    document.getElementById("pageSubtitle")
        .textContent = titles[page][1];

    document.getElementById("content")
        .innerHTML = views[page]();

}


/* =========================================================
   DASHBOARD
========================================================= */

views.dashboard = function(){

    const now =
        new Date();

    const upcoming =
        db.matches
        .filter(
            m =>
                getMatchDate(m) > now
        )
        .sort(
            (a,b) =>
                getMatchDate(a) -
                getMatchDate(b)
        );

    const currentMonth =
        monthKey(now);

    const currentStats =
        db.monthlyStats.find(
            x =>
                x.month === currentMonth
        );

    const totalDiamonds =
        currentStats?.totalDiamonds ||
        calculateAgencyDiamonds(currentMonth);

    return `

views.calendar = function(){

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    const firstDay =
        new Date(
            year,
            month,
            1
        );

    const lastDay =
        new Date(
            year,
            month + 1,
            0
        );

    let start =
        firstDay.getDay();

    /*
       Dimanche = 0.
       Pour un calendrier français :
       Lundi = 0.
    */

    start =
        start === 0
        ? 6
        : start - 1;

    const totalDays =
        lastDay.getDate();

    const cells = [];

    for(let i=0;i<start;i++){

        cells.push(`
            <div class="calendar-day empty-day"></div>
        `);

    }


    for(let day=1;day<=totalDays;day++){

        const dayMatches =
            db.matches.filter(
                m => {

                    const d =
                        getMatchDate(m);

                    return (
                        d.getFullYear() === year &&
                        d.getMonth() === month &&
                        d.getDate() === day
                    );

                }
            )
            .sort(
                (a,b) =>
                    getMatchDate(a) -
                    getMatchDate(b)
            );


        cells.push(`

            <div class="calendar-day">

                <div class="day-number">
                    ${day}
                </div>


                ${
                    dayMatches.map(
                        m => {

                            const c =
                                creator(m.creatorId);

                            const t =
                                team(m.teamId);

                            const d =
                                getMatchDate(m);

                            return `

                                <button
                                    class="calendar-event"
                                    onclick="
                                        matchDetails('${m.id}')
                                    "
                                >

                                    <div class="event-title">
                                        ⚔️ MATCH OFF
                                    </div>

                                    <div class="event-creator">

                                        ${esc(
                                            c?.name ||
                                            "Créateur"
                                        )}

                                    </div>

                                    <div class="event-team">

                                        👥
                                        ${esc(
                                            m.ourTeamName ||
                                            t?.name ||
                                            "Team"
                                        )}

                                    </div>

                                    <div class="event-time">

                                        ${d.toLocaleTimeString(
                                            "fr-FR",
                                            {
                                                hour:"2-digit",
                                                minute:"2-digit"
                                            }
                                        )}

                                    </div>

                                </button>

                            `;

                        }
                    ).join("")
                }

            </div>

        `);

    }


    while(
        cells.length % 7 !== 0
    ){

        cells.push(`
            <div class="calendar-day empty-day"></div>
        `);

    }


    return `

        <div class="calendar-toolbar">

            <button
                class="btn ghost"
                onclick="changeCalendarMonth(-1)"
            >
                ← Mois précédent
            </button>


            <div class="calendar-month">
                ${capitalize(
                    monthName(calendarDate)
                )}
            </div>


            <button
                class="btn ghost"
                onclick="changeCalendarMonth(1)"
            >
                Mois suivant →
            </button>

        </div>


        <div class="calendar-wrapper">

            <div class="calendar-grid">

                <div class="calendar-weekday">
                    Lun
                </div>

                <div class="calendar-weekday">
                    Mar
                </div>

                <div class="calendar-weekday">
                    Mer
                </div>

                <div class="calendar-weekday">
                    Jeu
                </div>

                <div class="calendar-weekday">
                    Ven
                </div>

                <div class="calendar-weekday">
                    Sam
                </div>

                <div class="calendar-weekday">
                    Dim
                </div>


                ${cells.join("")}

            </div>

        </div>


        <div
            class="muted"
            style="margin-top:14px"
        >
            💡 Cliquez sur un Match OFF pour afficher toutes
            ses informations.
        </div>

    `;

};


function changeCalendarMonth(amount){

    calendarDate =
        new Date(
            calendarDate.getFullYear(),
            calendarDate.getMonth() + amount,
            1
        );

    render();

}


function capitalize(text){

    if(!text)
        return "";

    return text.charAt(0).toUpperCase() +
        text.slice(1);

}

function previewAvatar(input){

    const file =
        input.files?.[0];

    if(!file)
        return;

    const reader =
        new FileReader();

    reader.onload =
        function(){

            pendingAvatar =
                reader.result;

            const preview =
                document.getElementById(
                    "avatarPreview"
                );

            if(preview){

                preview.innerHTML = `
                    <img
                        src="${pendingAvatar}"
                        class="avatar big"
                    >
                `;

            }

        };

    reader.readAsDataURL(file);

}

/* =========================================================

function fillCreators(selected=""){

    const teamId =
        document
        .getElementById("mteam")
        ?.value;


    const select =
        document
        .getElementById("mcreator");


    if(!select)
        return;


    const ids =
        team(teamId)
        ?.memberIds ||
        [];


    const members =
        db.creators.filter(
            c =>
                ids.includes(c.id)
        );


    select.innerHTML =

        `
        <option value="">
            Choisir un créateur...
        </option>
        `

        +

        members.map(
            c => `

                <option
                    value="${c.id}"
                    ${
                        c.id === selected
                        ? "selected"
                        : ""
                    }
                >
                    ${esc(c.name)}
                    —
                    @${esc(c.username)}
                </option>

            `
        ).join("");

}

/* =========================================================

========================================================= */

function submitMatch(event,id){

    event.preventDefault();


    const m =
        id
        ?
        db.matches.find(
            x =>
                x.id === id
        )
        :
        {
            id:uid()
        };


    if(!m)
        return;


    const agencyId =
        document
        .getElementById("agencySelect")
        .value;


    const selectedAgency =
        agency(agencyId);


    m.ourAgency =
        document
        .getElementById("ourAgency")
        .value
        .trim()
        ||
        "LVF — La Vraie Famille";


    m.teamId =
        document
        .getElementById("mteam")
        .value;


    m.ourTeamName =
        team(m.teamId)
        ?.name ||
        "";


    m.creatorId =
        document
        .getElementById("mcreator")
        .value;


    /*
       IMPORTANT :
       Une agence enregistrée est reconnue directement
       lorsqu'elle est sélectionnée.

       On ajoute également une reconnaissance par nom exact
       (sans tenir compte des majuscules/minuscules) afin
       d'éviter les doublons accidentels.
    */

    const typedAgency =
        document
        .getElementById("agencyName")
        .value
        .trim();


    let matchingAgency =
        selectedAgency;


    if(!matchingAgency && typedAgency){

        matchingAgency =
            db.agencies.find(
                a =>
                    a.name
                    .trim()
                    .toLowerCase()
                    ===
                    typedAgency
                    .trim()
                    .toLowerCase()
            );

    }


    m.agencyId =
        matchingAgency
        ?
        matchingAgency.id
        :
        "";


    m.agencyName =
        matchingAgency
        ?
        matchingAgency.name
        :
        typedAgency;


    m.opponentTeam =
        document
        .getElementById("oppTeam")
        .value
        .trim();


    m.opponentName =
        document
        .getElementById("oppName")
        .value
        .trim();


    m.opponentUsername =
        document
        .getElementById("oppUser")
        .value
        .trim()
        .replace(/^@/,"");


    const date =
        document
        .getElementById("mdate")
        .value;


    const time =
        document
        .getElementById("mtime")
        .value;


    m.datetime =
        date +
        "T" +
        time;


    m.theme =
        document
        .getElementById("mtheme")
        .value
        .trim();


    m.result =
        document
        .getElementById("mresult")
        .value;


    m.winner =
        document
        .getElementById("mwinner")
        .value
        .trim();


    m.notes =
        document
        .getElementById("mnotes")
        .value
        .trim();


    if(!id){

        db.matches.push(m);

    }


    save();

    closeModal();

    render();

}

/* =========================================================
   DIAMANTS
========================================================= */

function formatNumber(value){

    return Number(
        value || 0
    ).toLocaleString(
        "fr-FR"
    );

}


function formatMonthKey(key){

    if(!key)
        return "—";


    const parts =
        key.split("-");


    if(parts.length !== 2)
        return key;


    const d =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            1
        );


    return capitalize(
        d.toLocaleDateString(
            "fr-FR",
            {
                month:"long",
                year:"numeric"
            }
        )
    );

}


function getCurrentTeamDiamonds(teamId){

    const current =
        monthKey(new Date());


    const stats =
        db.monthlyStats.find(
            x =>
                x.month === current
        );


    if(stats?.teams){

        const value =
            stats.teams[teamId];


        if(value !== undefined)
            return Number(value) || 0;

    }


    const t =
        team(teamId);


    return Number(
        t?.currentDiamonds || 0
    ) || 0;

}


function calculateAgencyDiamonds(month){

    const stats =
        db.monthlyStats.find(
            x =>
                x.month === month
        );


    if(stats?.teams){

        return Object.values(
            stats.teams
        ).reduce(
            (sum,value) =>
                sum + (Number(value) || 0),
            0
        );

    }


    return db.teams.reduce(
        (sum,t) =>
            sum +
            Number(
                t.currentDiamonds || 0
            ),
        0
    );

}


function openMonthlyStats(){

function submitMonthlyStats(event){

    event.preventDefault();


    const month =
        document
        .getElementById("statsMonth")
        .value;


    if(!month)
        return;


    const teamData =
        {};


    document
    .querySelectorAll(
        ".team-diamond-input"
    )
    .forEach(
        input => {

            teamData[
                input.dataset.team
            ] =
                Number(
                    input.value || 0
                );

        }
    );


    const total =
        Object.values(
            teamData
        ).reduce(
            (sum,value) =>
                sum + value,
            0
        );


    let stats =
        db.monthlyStats.find(
            x =>
                x.month === month
        );


    if(!stats){

        stats = {
            id:uid(),
            month,
            teams:{},
            totalDiamonds:0,
            closed:false
        };

        db.monthlyStats.push(stats);

    }


    stats.teams =
        teamData;


    stats.totalDiamonds =
        total;


    save();

    closeModal();

    render();

}

function viewMonth(month){

    const stats =
        db.monthlyStats.find(
            x =>
                x.month === month
        );


    if(!stats)
        return;


    const ranking =
        db.teams
        .map(
            t => ({
                team:t,
                diamonds:Number(
                    stats.teams?.[t.id] || 0
                )
            })
        )
        .sort(
            (a,b) =>
                b.diamonds -
                a.diamonds
        );


    openModal(

        formatMonthKey(month),

        `

        <div class="diamond-box">

            <div class="muted">
                Total LVF
            </div>

            <div class="diamond-value">
                ${formatNumber(
                    stats.totalDiamonds
                )}
                💎
            </div>

        </div>


        <div class="section">

            <h3>
                Classement des Teams
            </h3>

            <div class="list">

                ${
                    ranking.map(
                        (x,index) => `

                            <div class="month-row">

                                <div class="person">

                                    <div class="rank">
                                        ${index + 1}
                                    </div>

                                    <b>
                                        ${esc(
                                            x.team.name
                                        )}
                                    </b>

                                </div>


                                <b>
                                    ${formatNumber(
                                        x.diamonds
                                    )}
                                    💎
                                </b>

                            </div>

                        `
                    ).join("")
                }

            </div>

        </div>

        `

    );

}
