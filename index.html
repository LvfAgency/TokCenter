<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TokCenter</title>

<style>
:root{
  --bg:#f5f6fa;
  --card:#fff;
  --sidebar:#111827;
  --sidebar2:#1b2435;
  --text:#182033;
  --muted:#7b8497;
  --border:#e5e7ee;
  --violet:#7c3aed;
  --violetLight:#f1eaff;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#ea580c;
  --shadow:0 10px 30px rgba(20,25,40,.07);
  --radius:18px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:88px;
  min-width:88px;
  height:100vh;
  position:fixed;
  left:0;
  top:0;
  background:var(--sidebar);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 12px;
  z-index:50;
  box-shadow:8px 0 30px rgba(0,0,0,.08);
}

.side-logo{
  width:54px;
  height:54px;
  border-radius:16px;
  background:#1d2537;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:30px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  letter-spacing:-1px;
}

.side-logo span{
  color:#a855f7;
}

.nav{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.nav-btn{
  width:100%;
  height:56px;
  border:0;
  border-radius:15px;
  background:transparent;
  color:#8992a5;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  transition:.2s;
}

.nav-btn svg{
  width:24px;
  height:24px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.nav-btn:hover{
  color:#fff;
  background:var(--sidebar2);
}

.nav-btn.active{
  color:#fff;
  background:var(--violet);
  box-shadow:0 8px 20px rgba(124,58,237,.3);
}

.nav-btn::after{
  content:attr(data-tooltip);
  position:absolute;
  left:72px;
  top:50%;
  transform:translateY(-50%);
  background:#111827;
  color:#fff;
  padding:8px 11px;
  border-radius:8px;
  white-space:nowrap;
  font-size:12px;
  font-weight:600;
  opacity:0;
  pointer-events:none;
  transition:.15s;
  box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.nav-btn:hover::after{
  opacity:1;
}

.sidebar-bottom{
  margin-top:auto;
  width:100%;
}

.clear-btn{
  width:100%;
  height:50px;
  border:0;
  background:transparent;
  color:#70798d;
  border-radius:14px;
}

.clear-btn:hover{
  color:#f87171;
  background:#241b26;
}

.clear-btn svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

/* =========================
   MAIN
========================= */

.main{
  margin-left:88px;
  width:calc(100% - 88px);
  min-height:100vh;
}

.topbar{
  height:82px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 38px;
  position:sticky;
  top:0;
  z-index:40;
}

.logo{
  font-size:25px;
  font-weight:850;
  letter-spacing:-1.2px;
}

.logo .center{
  color:var(--violet);
}

.top-actions{
  display:flex;
  gap:10px;
  align-items:center;
}

.icon-action{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
  color:#687286;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-action:hover{
  background:#f7f7fb;
  color:var(--violet);
}

.icon-action svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.page{
  padding:38px;
  max-width:1550px;
  margin:0 auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:28px;
}

.page-head h1{
  margin:0 0 7px;
  font-size:30px;
  letter-spacing:-.8px;
}

.page-head p{
  margin:0;
  color:var(--muted);
  font-size:14px;
}

.primary{
  border:0;
  background:var(--violet);
  color:#fff;
  border-radius:12px;
  padding:12px 17px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  box-shadow:0 7px 18px rgba(124,58,237,.2);
}

.primary:hover{
  filter:brightness(.96);
}

.primary svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
}

/* =========================
   STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:22px;
}

.stat-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px;
  box-shadow:var(--shadow);
}

.stat-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.stat-icon{
  width:42px;
  height:42px;
  border-radius:12px;
  background:var(--violetLight);
  color:var(--violet);
  display:flex;
  align-items:center;
  justify-content:center;
}

.stat-icon svg{
  width:21px;
  height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

.stat-label{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

.stat-number{
  font-size:29px;
  font-weight:800;
  letter-spacing:-1px;
}

/* =========================
   CARDS
========================= */

.grid-2{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:22px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}

.card-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.card-title h2{
  margin:0;
  font-size:17px;
}

.card-title span{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   EMPTY
========================= */

.empty{
  padding:52px 24px;
  text-align:center;
  color:var(--muted);
}

.empty-icon{
  width:62px;
  height:62px;
  border-radius:18px;
  background:#f1f2f6;
  color:#9aa2b2;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
}

.empty-icon svg{
  width:28px;
  height:28px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.6;
}

.empty strong{
  display:block;
  color:var(--text);
  margin-bottom:7px;
  font-size:15px;
}

.empty p{
  margin:0;
  font-size:13px;
}

/* =========================
   LIST
========================= */

.list{
  display:flex;
  flex-direction:column;
  gap:11px;
}

.list-row{
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  background:#fff;
}

.list-main{
  min-width:0;
  display:flex;
  align-items:center;
  gap:13px;
}

.list-info{
  min-width:0;
}

.list-main strong{
  display:block;
  font-size:14px;
  margin-bottom:4px;
}

.list-main small{
  color:var(--muted);
  font-size:12px;
}

.row-actions{
  display:flex;
  gap:7px;
  flex-shrink:0;
}

.small-btn{
  border:1px solid var(--border);
  background:#fff;
  color:#657084;
  width:35px;
  height:35px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.small-btn:hover{
  background:#f5f6f9;
  color:var(--violet);
}

.small-btn.danger:hover{
  color:var(--red);
  background:#fff5f5;
}

.small-btn svg{
  width:16px;
  height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* =========================
   AVATARS / IMAGES
========================= */

.avatar{
  width:52px;
  height:52px;
  border-radius:14px;
  flex-shrink:0;
  overflow:hidden;
  background:#eeeef4;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7c8495;
  font-weight:800;
  font-size:16px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.avatar.large{
  width:82px;
  height:82px;
  border-radius:20px;
  font-size:24px;
}

.avatar.creator{
  border-radius:50%;
}

.avatar.team{
  border-radius:16px;
}

/* =========================
   MATCH
========================= */

.match-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
  margin-bottom:12px;
  background:#fff;
}

.match-date{
  color:var(--violet);
  font-size:12px;
  font-weight:800;
  margin-bottom:10px;
}

.match-vs{
  display:flex;
  align-items:center;
  gap:16px;
}

.match-side{
  flex:1;
  min-width:0;
}

.match-side strong{
  font-size:15px;
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.match-side small{
  color:var(--muted);
  display:block;
  margin-top:4px;
}

.agency-side{
  text-align:right;
}

.vs{
  width:40px;
  height:40px;
  border-radius:12px;
  background:#f2efff;
  color:var(--violet);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  flex-shrink:0;
}

.match-person{
  display:flex;
  align-items:center;
  gap:11px;
}

.match-person .avatar{
  width:42px;
  height:42px;
  border-radius:12px;
}

/* =========================
   BADGES
========================= */

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:5px 9px;
  font-size:11px;
  font-weight:700;
}

.badge-purple{
  background:#f1eaff;
  color:#6d28d9;
}

.badge-green{
  background:#eaf8ef;
  color:#15803d;
}

.badge-red{
  background:#fff0f0;
  color:#b91c1c;
}

.badge-orange{
  background:#fff3e9;
  color:#c2410c;
}

.badge-gray{
  background:#f1f2f5;
  color:#667085;
}

/* =========================
   SEARCH
========================= */

.search{
  position:relative;
  width:300px;
}

.search input{
  width:100%;
  height:43px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 14px 0 40px;
  outline:none;
  background:#fff;
}

.search input:focus{
  border-color:#a78bfa;
  box-shadow:0 0 0 3px rgba(124,58,237,.08);
}

.search svg{
  position:absolute;
  left:13px;
  top:12px;
  width:18px;
  height:18px;
  stroke:#929aaa;
  fill:none;
  stroke-width:1.8;
}

/* =========================
   MODAL
========================= */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.55);
  backdrop-filter:blur(4px);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(680px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:22px;
  box-shadow:0 30px 80px rgba(0,0,0,.22);
}

.modal-head{
  padding:24px 26px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-head h2{
  margin:0;
  font-size:19px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  background:#f2f3f6;
  border-radius:10px;
  color:#697386;
  display:flex;
  align-items:center;
  justify-content:center;
}

.close:hover{
  background:#e9eaf0;
}

.close svg{
  width:18px;
  height:18px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}

.form{
  padding:24px 26px 26px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.field.full{
  grid-column:1/-1;
}

.field label{
  font-size:12px;
  font-weight:750;
  color:#475166;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #dfe2e9;
  background:#fff;
  border-radius:11px;
  padding:11px 12px;
  color:var(--text);
  outline:none;
  transition:.15s;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#a78bfa;
  box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

.field textarea{
  resize:vertical;
  min-height:95px;
}

.form-actions{
  margin-top:22px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.secondary{
  border:1px solid var(--border);
  background:#fff;
  color:#596579;
  border-radius:11px;
  padding:11px 16px;
  font-weight:700;
}

.secondary:hover{
  background:#f7f7f9;
}

/* =========================
   IMAGE UPLOAD
========================= */

.image-upload{
  border:1.5px dashed #d6d9e2;
  border-radius:16px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:16px;
  background:#fafafd;
}

.image-upload:hover{
  border-color:#a78bfa;
}

.image-upload-info{
  flex:1;
}

.image-upload-info strong{
  display:block;
  font-size:13px;
  margin-bottom:4px;
}

.image-upload-info span{
  color:var(--muted);
  font-size:11px;
}

.upload-button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  border:1px solid var(--border);
  background:#fff;
  color:#596579;
  border-radius:10px;
  padding:9px 12px;
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.upload-button:hover{
  color:var(--violet);
  border-color:#c4b5fd;
}

.upload-button svg{
  width:16px;
  height:16px;
  stroke:currentColor;
  fill:none;
  stroke-width:1.8;
}

/* =========================
   CALENDAR
========================= */

.calendar-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}

.calendar-head{
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
}

.calendar-head strong{
  font-size:17px;
  text-transform:capitalize;
}

.calendar-nav{
  display:flex;
  gap:7px;
}

.calendar-nav button{
  height:35px;
  padding:0 11px;
  border:1px solid var(--border);
  background:#fff;
  border-radius:9px;
  color:#657084;
}

.calendar-nav button:hover{
  color:var(--violet);
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
}

.day-name{
  padding:13px 8px;
  text-align:center;
  color:#8b94a5;
  font-size:11px;
  font-weight:800;
  border-bottom:1px solid var(--border);
}

.day{
  min-height:125px;
  border-right:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:9px;
  background:#fff;
}

.day:nth-child(7n){
  border-right:0;
}

.day.other{
  background:#fafafd;
  color:#b3b8c4;
}

.day.today .day-num{
  background:var(--violet);
  color:#fff;
}

.day-num{
  width:27px;
  height:27px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:750;
  margin-bottom:7px;
}

.cal-match{
  padding:6px 7px;
  border-radius:8px;
  background:#f1eaff;
  color:#5b21b6;
  font-size:10px;
  font-weight:700;
  margin-bottom:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   RANKING
========================= */

.rank-table{
  width:100%;
  border-collapse:collapse;
}

.rank-table th{
  text-align:left;
  color:#8a93a4;
  font-size:11px;
  padding:0 10px 12px;
  border-bottom:1px solid var(--border);
}

.rank-table td{
  padding:14px 10px;
  border-bottom:1px solid #f0f1f4;
  font-size:13px;
}

.rank-number{
  width:28px;
  height:28px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#f2f3f6;
  font-weight:800;
}

.rank-name{
  font-weight:750;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-2{
    grid-template-columns:1fr;
  }
}

@media(max-width:700px){

  .sidebar{
    width:70px;
    min-width:70px;
    padding:15px 8px;
  }

  .main{
    margin-left:70px;
    width:calc(100% - 70px);
  }

  .topbar{
    padding:0 18px;
  }

  .page{
    padding:22px 15px;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .stats{
    grid-template-columns:1fr 1fr;
    gap:10px;
  }

  .stat-card{
    padding:16px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full{
    grid-column:auto;
  }

  .search{
    width:100%;
  }

  .day{
    min-height:85px;
    padding:5px;
  }

  .day-name{
    font-size:9px;
  }

  .cal-match{
    font-size:8px;
  }

  .match-vs{
    gap:8px;
  }

  .match-side strong{
    font-size:13px;
  }

  .list-row{
    align-items:flex-start;
  }

  .image-upload{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- ======================================================
     SIDEBAR
====================================================== -->

<aside class="sidebar">

  <div class="side-logo">
    T<span>C</span>
  </div>

  <nav class="nav">

    <!-- ACCUEIL -->
    <button class="nav-btn active"
            data-page="home"
            data-tooltip="Accueil"
            aria-label="Accueil">
      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7"/>
        <path d="M5 9.5V21h14V9.5"/>
        <path d="M9 21v-7h6v7"/>
      </svg>
    </button>

    <!-- MATCH -->
    <button class="nav-btn"
            data-page="matches"
            data-tooltip="Match"
            aria-label="Match">
      <svg viewBox="0 0 24 24">
        <path d="m14.5 5.5 4-4"/>
        <path d="m19 2 3 3-4 4"/>
        <path d="m9.5 18.5-4 4"/>
        <path d="m5 22-3-3 4-4"/>
        <path d="m14 10 8 8"/>
        <path d="m10 14-8-8"/>
        <path d="m13 7 4 4"/>
        <path d="m7 13 4 4"/>
      </svg>
    </button>

    <!-- TEAM -->
    <button class="nav-btn"
            data-page="teams"
            data-tooltip="Team"
            aria-label="Team">
      <svg viewBox="0 0 24 24">

<script>

/* ==========================================================
   TOKCENTER
========================================================== */

const STORAGE_KEY = "tokcenter_clean_v2";

const emptyDB = {
  teams:[],
  creators:[],
  agencies:[],
  matches:[]
};

let db = loadDB();
let currentPage = "home";
let editingId = null;
let currentModalType = null;
let calendarDate = new Date();


/* ==========================================================
   DATABASE
========================================================== */

function loadDB(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(!saved){
      return structuredClone(emptyDB);
    }

    const parsed = JSON.parse(saved);

    return {
      teams:Array.isArray(parsed.teams) ? parsed.teams : [],
      creators:Array.isArray(parsed.creators) ? parsed.creators : [],
      agencies:Array.isArray(parsed.agencies) ? parsed.agencies : [],
      matches:Array.isArray(parsed.matches) ? parsed.matches : []
    };

  }catch(error){

    return structuredClone(emptyDB);

  }
}


function saveDB(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );

}


function uid(){

  return Date.now().toString(36)
    + Math.random().toString(36).slice(2,9);

}


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(dateString){

  if(!dateString){
    return "Date non définie";
  }

  const d = new Date(dateString+"T00:00:00");

  if(Number.isNaN(d.getTime())){
    return dateString;
  }

  return d.toLocaleDateString(
    "fr-FR",
    {
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );

}


function formatShortDate(dateString){

  if(!dateString){
    return "";
  }

  const d = new Date(dateString+"T00:00:00");

  return d.toLocaleDateString(
    "fr-FR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


function todayISO(){

  const d = new Date();

  return (
    d.getFullYear()
    + "-"
    + String(d.getMonth()+1).padStart(2,"0")
    + "-"
    + String(d.getDate()).padStart(2,"0")
  );

}


function getTeam(id){
  return db.teams.find(x=>x.id===id);
}


function getCreator(id){
  return db.creators.find(x=>x.id===id);
}


function getAgency(id){
  return db.agencies.find(x=>x.id===id);
}


function nowDateTime(match){

  if(!match.date){
    return Infinity;
  }

  return new Date(
    `${match.date}T${match.time || "00:00"}:00`
  ).getTime();

}


function getMatchAgencyName(match){

  const agency = getAgency(match.agencyId);

  return agency
    ? agency.name
    : (match.agencyName || "Agence non définie");

}


function getMatchCreatorName(match){

  const creator = getCreator(match.creatorId);

  return creator
    ? creator.name
    : "Créateur non défini";

}


function getMatchTeamName(match){

  const team = getTeam(match.teamId);

  return team
    ? team.name
    : "Team non définie";

}


/* ==========================================================
   AVATAR
========================================================== */

function avatarHTML(item,type,size="normal"){

  const image = item?.image || "";

  let initials = "?";

  if(item?.name){
    initials = item.name
      .trim()
      .split(/\s+/)
      .slice(0,2)
      .map(x=>x[0])
      .join("")
      .toUpperCase();
  }

  const classes =
    `avatar ${type || ""} ${size === "large" ? "large" : ""}`;

  if(image){

    return `
      <div class="${classes}">
        <img src="${esc(image)}" alt="">
      </div>
    `;

  }

  return `
    <div class="${classes}">
      ${esc(initials)}
    </div>
  `;

}


/* ==========================================================
   BADGES
========================================================== */

function statusBadge(status){

  if(status==="Terminé"){
    return `<span class="badge badge-green">Terminé</span>`;
  }

  if(status==="Annulé"){
    return `<span class="badge badge-red">Annulé</span>`;
  }

  return `<span class="badge badge-purple">À venir</span>`;

}


function resultBadge(result){

  if(result==="Victoire"){
    return `<span class="badge badge-green">Victoire</span>`;
  }

  if(result==="Défaite"){
    return `<span class="badge badge-red">Défaite</span>`;
  }

  if(result==="Égalité"){
    return `<span class="badge badge-orange">Égalité</span>`;
  }

  return `<span class="badge badge-gray">À jouer</span>`;

}


/* ==========================================================
   NAVIGATION
========================================================== */

document.querySelectorAll(".nav-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".nav-btn")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    currentPage = btn.dataset.page;

    render();

  });

});


/* ==========================================================
   RENDER
========================================================== */

function render(){

  const content = document.getElementById("content");

  if(currentPage==="home"){
    content.innerHTML = renderHome();
  }

  if(currentPage==="teams"){
    content.innerHTML = renderTeams();
  }

  if(currentPage==="creators"){
    content.innerHTML = renderCreators();
  }

  if(currentPage==="agencies"){
    content.innerHTML = renderAgencies();
  }

  if(currentPage==="matches"){
    content.innerHTML = renderMatches();
  }

  if(currentPage==="calendar"){
    content.innerHTML = renderCalendar();
  }

  if(currentPage==="ranking"){
    content.innerHTML = renderRanking();
  }

  attachPageEvents();

}

      </div>


      <div class="card">

        <div class="card-title">

          <h2>
            Derniers Matchs
          </h2>

          <span>
            ${db.matches.length}
          </span>

/* ==========================================================
   CALENDAR
========================================================== */

function renderCalendar(){

  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  const monthName =
    calendarDate.toLocaleDateString(
      "fr-FR",
      {
        month:"long",
        year:"numeric"
      }
    );

  const firstDay =
    new Date(year,month,1);

  let startDay = firstDay.getDay();

  startDay =
    startDay===0
    ? 6
    : startDay-1;

  const daysInMonth =
    new Date(year,month+1,0).getDate();

  let cells = "";

  for(let i=0;i<42;i++){

    const dayNumber =
      i-startDay+1;

    let dateObj;
    let isOther=false;

    if(dayNumber<1){

      dateObj =
        new Date(
          year,
          month-1,
          dayNumber
        );

      isOther=true;

    }else if(dayNumber>daysInMonth){

      dateObj =
        new Date(
          year,
          month+1,
          dayNumber-daysInMonth
        );

      isOther=true;

    }else{

      dateObj =
        new Date(
          year,
          month,
          dayNumber
        );

    }

    const iso =
      dateObj.getFullYear()
      + "-"
      + String(dateObj.getMonth()+1).padStart(2,"0")
      + "-"
      + String(dateObj.getDate()).padStart(2,"0");

    const matches =
      db.matches.filter(m=>m.date===iso);

    const today =
      todayISO()===iso;

    cells += `

      <div class="day
        ${isOther ? "other" : ""}
        ${today ? "today" : ""}
      ">

        <div class="day-num">
          ${dateObj.getDate()}
        </div>

        ${
          matches.map(m=>`

            <div class="cal-match"
                 title="${esc(
                   getMatchCreatorName(m)
                   +" vs "
                   +getMatchAgencyName(m)
                 )}">

              ${esc(getMatchCreatorName(m))}
              vs
              ${esc(getMatchAgencyName(m))}

            </div>

          `).join("")
        }

      </div>

    `;

  }

  return `

    <div class="page-head">

      <div>
        <h1>Calendrier</h1>
        <p>
          Visualise tous tes Matchs OFF.
        </p>
      </div>

      <button class="primary"
              onclick="openModal('match')">

        ${plusIcon()}

        Nouveau Match

      </button>

    </div>


    <div class="calendar-card">

      <div class="calendar-head">

        <strong>
          ${esc(monthName)}
        </strong>


        <div class="calendar-nav">

          <button onclick="changeMonth(-1)">
            ‹
          </button>

          <button onclick="goToday()">
            Aujourd'hui
          </button>

          <button onclick="changeMonth(1)">
            ›
          </button>

        </div>

      </div>


      <div class="calendar-grid">

        <div class="day-name">LUN</div>
        <div class="day-name">MAR</div>
        <div class="day-name">MER</div>
        <div class="day-name">JEU</div>
        <div class="day-name">VEN</div>
        <div class="day-name">SAM</div>
        <div class="day-name">DIM</div>

        ${cells}

      </div>

    </div>

  `;

}


function changeMonth(direction){

  calendarDate.setMonth(
    calendarDate.getMonth()+direction
  );

  render();

}


function goToday(){

  calendarDate = new Date();

  render();

}


/* ==========================================================

function renderRanking(){

    db.teams
      .map(team=>{

          db.matches.filter(
            m=>m.teamId===team.id
          );

        const wins =
          matches.filter(
            m=>m.result==="Victoire"
          ).length;

        const losses =
          matches.filter(
            m=>m.result==="Défaite"
          ).length;

        const draws =
          matches.filter(
            m=>m.result==="Égalité"
          ).length;

        return {
          name:team.name,
          matches:matches.length,
          wins,
          losses,
          draws

              : "Créer le Match OFF"}

          </button>

        </div>

      </form>

    `;

  }


  backdrop.classList.add("open");

}


/* ==========================================================
   IMAGE PREVIEW
========================================================== */

function previewImage(
  input,
  previewId,
  type,
  size="normal"
){

  const file = input.files?.[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Merci de sélectionner une image.");
    input.value="";
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const container =
      document.getElementById(previewId);

    if(!container){
      return;
    }

    container.innerHTML = `

      <div class="avatar ${type} ${size==="large" ? "large" : ""}">
        <img src="${e.target.result}" alt="">
      </div>

    `;

  };

  reader.readAsDataURL(file);

}

/* ==========================================================
   SAVE TEAM
========================================================== */

function saveTeam(e){

  e.preventDefault();

  const name =
    document
      .getElementById("teamName")
      .value
      .trim();

  const tiktok =
    document
      .getElementById("teamTikTok")
      .value
      .trim();

  const description =
    document
      .getElementById("teamDescription")
      .value
      .trim();

  const file =
    document
      .getElementById("teamImage")
      ?.files?.[0];


  if(!name){
    return;
  }


  const existing =
    editingId
    ? getTeam(editingId)
    : null;


  const finish = image=>{

    const data={
      name,
      tiktok,
      description,
      image:
        image !== undefined
        ? image
        : (existing?.image || "")
    };


    if(editingId){

      if(existing){
        Object.assign(existing,data);
      }

    }else{

      db.teams.push({
        id:uid(),
        ...data
      });

    }


    saveDB();
    closeModal();
    render();

  };


  if(file){

    readFileAsDataURL(
      file,
      finish
    );

  }else{

    finish(undefined);

  }

}

/* ==========================================================
   FILE TO DATA URL
========================================================== */

function readFileAsDataURL(file,callback){

  const reader =
    new FileReader();

  reader.onload = ()=>{
    callback(reader.result);
  };

  reader.onerror = ()=>{
    alert("Impossible de lire cette image.");
  };

  reader.readAsDataURL(file);

}

/* ==========================================================
   SAVE MATCH
========================================================== */

function saveMatch(e){

  e.preventDefault();

  const agencyId =
    document
      .getElementById("matchAgency")
      .value;

  const typedAgency =
    document
      .getElementById("matchAgencyName")
      .value
      .trim();

  const selectedAgency =
    agencyId
    ? getAgency(agencyId)
    : null;


  const data={

    date:
      document
        .getElementById("matchDate")
        .value,

    time:
      document
        .getElementById("matchTime")
        .value,

    theme:
      document
        .getElementById("matchTheme")
        .value
        .trim(),

    creatorId:
      document
        .getElementById("matchCreator")
        .value,

    teamId:
      document
        .getElementById("matchTeam")
        .value,

    agencyId:
      agencyId || "",

    agencyName:
      selectedAgency
      ? selectedAgency.name
      : typedAgency,

    status:
      document
        .getElementById("matchStatus")
        .value,

    result:
      document
        .getElementById("matchResult")
        .value,

    notes:
      document
        .getElementById("matchNotes")
        .value
        .trim()

  };


  if(
    !data.date ||
    !data.creatorId ||
    !data.teamId
  ){

    alert(
      "Merci de renseigner la date, le créateur et la Team."
    );

    return;
  }


  if(
    !data.agencyId &&
    !data.agencyName
  ){

    alert(
      "Merci de sélectionner une agence ou de saisir le nom de l'agence adverse."
    );

    return;
  }


  if(editingId){

    const match =
      db.matches.find(
        x=>x.id===editingId
      );

    if(match){
      Object.assign(
        match,
        data
      );
    }

  }else{

    db.matches.push({
      id:uid(),
      createdAt:new Date().toISOString(),
      ...data
    });

  }


  saveDB();
  closeModal();
  render();

}

/* ==========================================================
   DELETE
========================================================== */

function deleteItem(type,id){

  let label="cet élément";

  if(type==="team"){
    label="cette Team";
  }

  if(type==="creator"){
    label="ce Créateur";
  }

  if(type==="agency"){
    label="cette Agence";
  }

  if(type==="match"){
    label="ce Match OFF";
  }


  if(
    !confirm(
      `Voulez-vous vraiment supprimer ${label} ?`
    )
  ){

    return;

  }


  if(type==="team"){

    db.teams =
      db.teams.filter(
        x=>x.id!==id
      );

  }


  if(type==="creator"){

    db.creators =
      db.creators.filter(
        x=>x.id!==id
      );

  }


  if(type==="agency"){

    const agency =
      getAgency(id);

    db.agencies =
      db.agencies.filter(
        x=>x.id!==id
      );


    db.matches.forEach(m=>{

      if(m.agencyId===id){

        m.agencyId="";

        m.agencyName =
          agency
          ? agency.name
          : m.agencyName;

      }

    });

  }


  if(type==="match"){

    db.matches =
      db.matches.filter(
        x=>x.id!==id
      );

  }


  saveDB();
  render();

}

/* ==========================================================
   EXPORT
========================================================== */

document
  .getElementById("exportData")
  .addEventListener(
    "click",
    ()=>{

      const blob =
        new Blob(
          [
            JSON.stringify(
              db,
              null,
              2
            )
          ],
          {
            type:"application/json"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href=url;

      a.download=
        "tokcenter-donnees.json";

      document.body.appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(url);

    }
  );


/* ==========================================================
   IMPORT
========================================================== */

document
  .getElementById("importData")
  .addEventListener(
    "change",
    async e=>{

      const file =
        e.target.files[0];

      if(!file){
        return;
      }


      try{

        const text =
          await file.text();

        const imported =
          JSON.parse(text);


        if(
          !Array.isArray(imported.teams) ||
          !Array.isArray(imported.creators) ||
          !Array.isArray(imported.agencies) ||
          !Array.isArray(imported.matches)
        ){

          throw new Error("Format invalide");

        }


        if(
          !confirm(
            "Importer ces données va remplacer les données actuellement présentes. Continuer ?"
          )
        ){

          e.target.value="";
          return;

        }


        db={

          teams:imported.teams,
          creators:imported.creators,
          agencies:imported.agencies,
          matches:imported.matches

        };


        saveDB();
        render();

        alert(
          "Import terminé."
        );

      }catch(error){

        alert(
          "Impossible d'importer ce fichier."
        );

      }


      e.target.value="";

    }
  );

document
  .getElementById("resetData")
  .addEventListener(

    ()=>{

      const confirmation =
        prompt(

        );


      if(
        confirmation!=="SUPPRIMER"
      ){

      db =
        structuredClone(

        );

    }
  );
