<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>TokCenter — Gestion d'agence</title>

<style>
:root{
    --bg:#f4f6fa;
    --card:#ffffff;
    --text:#172033;
    --muted:#6b7280;
    --line:#e5e7eb;
    --primary:#7c3aed;
    --primary-dark:#5b21b6;
    --primary-soft:#ede9fe;
    --danger:#dc2626;
    --danger-soft:#fee2e2;
    --success:#059669;
    --blue:#2563eb;
    --shadow:0 10px 30px rgba(17,24,39,.08);
    --radius:18px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
}

.app{
    min-height:100vh;
    display:flex;
}

/* =========================
   BARRE LATÉRALE
========================= */

.sidebar{
    width:255px;
    background:linear-gradient(180deg,#111827 0%,#171b2e 100%);
    color:white;
    padding:20px 14px;
    position:fixed;
    inset:0 auto 0 0;
    z-index:30;
    box-shadow:8px 0 25px rgba(0,0,0,.08);
}

.logo{
    padding:8px 13px 25px;
    font-size:27px;
    font-weight:950;
    letter-spacing:-1.5px;
}

.logo span{
    color:#a78bfa;
}

.logo-sub{
    display:block;
    font-size:10px;
    letter-spacing:1.4px;
    color:#9ca3af;
    text-transform:uppercase;
    margin-top:4px;
    font-weight:700;
}

.nav{
    display:grid;
    gap:7px;
}

/* Navigation compacte avec grosses icônes */

.nav button{
    width:100%;
    height:58px;
    display:flex;
    align-items:center;
    gap:14px;
    background:transparent;
    color:#cbd5e1;
    text-align:left;
    padding:9px 12px;
    border-radius:14px;
    font-weight:750;
    transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
}

.nav button:hover{
    background:rgba(124,58,237,.18);
    color:white;
    transform:translateX(2px);
}

.nav button.active{
    background:linear-gradient(135deg,#6d28d9,#7c3aed);
    color:white;
    box-shadow:0 7px 18px rgba(124,58,237,.28);
}

/* Icônes beaucoup plus explicites */

.nav-icon{
    width:38px;
    height:38px;
    min-width:38px;
    display:grid;
    place-items:center;
    font-size:23px;
    line-height:1;
    border-radius:11px;
    background:rgba(255,255,255,.07);
    transition:.18s;
}

.nav button:hover .nav-icon{
    background:rgba(255,255,255,.13);
    transform:scale(1.05);
}

.nav button.active .nav-icon{
    background:rgba(255,255,255,.18);
}

/* Petit indicateur de page active */

.nav button.active::after{
    content:"";
    width:4px;
    height:28px;
    background:white;
    border-radius:999px;
    margin-left:auto;
}

/* =========================
   CONTENU
========================= */

.main{
    margin-left:255px;
    width:calc(100% - 255px);
    padding:28px;
    max-width:1550px;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:25px;
}

.title h1{
    margin:0;
    font-size:30px;
    letter-spacing:-.7px;
}

.title p{
    margin:5px 0 0;
    color:var(--muted);
}

/* =========================
   BOUTONS
========================= */

.btn{
    padding:11px 16px;
    border-radius:11px;
    font-weight:800;
    transition:.15s;
}

.btn:hover{
    transform:translateY(-1px);
}

.primary{
    background:var(--primary);
    color:white;
}

.primary:hover{
    background:var(--primary-dark);
}

.secondary{
    background:#eef2ff;
    color:#4338ca;
}

.ghost{
    background:#f3f4f6;
    color:#374151;
}

.danger{
    background:var(--danger-soft);
    color:#991b1b;
}

.star{
    background:#fff7ed;
    color:#f59e0b;
    font-size:19px;
}

/* =========================
   CARTES
========================= */

.grid{
    display:grid;
    gap:18px;
}

.stats{
    grid-template-columns:repeat(4,1fr);
}

.cards{
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
}

.card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:var(--shadow);
}

.card:hover{
    border-color:#ddd6fe;
}

.stat .label{
    color:var(--muted);
    font-weight:700;
}

.stat .num{
    font-size:32px;
    font-weight:950;
    margin-top:8px;
}

.section{
    margin-top:25px;
}

.section h2{
    font-size:19px;
    margin:0 0 13px;
}

.empty{
    padding:38px;
    text-align:center;
    color:var(--muted);
    background:white;
    border:1px dashed #d1d5db;
    border-radius:16px;
}

.row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:5px 9px;
    border-radius:999px;
    background:var(--primary-soft);
    color:#5b21b6;
    font-size:12px;
    font-weight:850;
}

.muted{
    color:var(--muted);
    font-size:14px;
}

.small{
    font-size:12px;
}

/* =========================
   AVATARS
========================= */

.avatar{
    width:54px;
    height:54px;
    border-radius:50%;
    object-fit:cover;
    background:#ede9fe;
    display:grid;
    place-items:center;
    font-weight:900;
    color:#5b21b6;
    flex:none;
}

.avatar.big{
    width:82px;
    height:82px;
    font-size:28px;
}

.person{
    display:flex;
    align-items:center;
    gap:12px;
}

/* =========================
   RECHERCHE
========================= */

.search{
    margin-bottom:16px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid var(--line);
    border-radius:12px;
    background:white;
    outline:none;
}

.search input:focus,
.field input:focus,
.field select:focus,
.field textarea:focus{
    border-color:#a78bfa;
    box-shadow:0 0 0 3px rgba(124,58,237,.1);
}

/* =========================
   TEAMS
========================= */

.teamhead{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:15px;
}

.teamicon{
    width:55px;
    height:55px;
    border-radius:15px;
    background:linear-gradient(135deg,#111827,#312e81);
    color:white;
    display:grid;
    place-items:center;
    font-weight:900;
    font-size:20px;
}

.list{
    display:grid;
    gap:10px;
}

.listitem{
    border:1px solid var(--line);
    border-radius:13px;
    padding:12px;
    background:#fafafa;
}

/* =========================
   MATCHS
========================= */

.match{
    border-left:5px solid var(--primary);
}

.match .date{
    font-weight:900;
}

.vs{
    font-size:17px;
    font-weight:900;
    line-height:1.45;
}

.status{
    font-size:12px;
    font-weight:900;
}

.upcoming{
    color:var(--blue);
}

.done{
    color:var(--success);
}

/* =========================
   AGENCES
========================= */

.favorite{
    background:#fffdf7;
    border-color:#fde68a;
}

.agency-card{
    position:relative;
    overflow:hidden;
}

.agency-card.favorite::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
    background:#f59e0b;
}

.agency-icon{
    width:55px;
    height:55px;
    border-radius:15px;
    display:grid;
    place-items:center;
    background:#111827;
    color:white;
    font-weight:950;
    font-size:20px;
}

.notice{
    padding:13px 15px;
    background:#f5f3ff;
    border:1px solid #ddd6fe;
    border-radius:13px;
    color:#4c1d95;
    margin-bottom:15px;
}

.saved-agency{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:11px 13px;
    border:1px solid #e5e7eb;
    border-radius:12px;
    background:#fafafa;
}

.saved-agency:hover{
    background:#f5f3ff;
}

/* =========================
   TABS
========================= */

.tabs{
    display:flex;
    gap:8px;
    overflow:auto;
    margin-bottom:18px;
}

.tab{
    background:#e5e7eb;
    padding:10px 15px;
    border-radius:10px;
    font-weight:800;
    white-space:nowrap;
}

.tab.active{
    background:#111827;
    color:white;
}

/* =========================
   MODALE
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.62);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    backdrop-filter:blur(3px);
}

.modal.open{
    display:flex;
}

.modalbox{
    background:white;
    border-radius:21px;
    width:min(720px,100%);
    max-height:92vh;
    overflow:auto;
    padding:25px;
    box-shadow:0 25px 70px rgba(0,0,0,.25);
}

.modalhead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:19px;
}

.modalhead h2{
    margin:0;
}

.close{
    background:#f3f4f6;
    border-radius:10px;
    padding:8px 11px;
}

/* =========================
   FORMULAIRES
========================= */

.formgrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.field{
    display:grid;
    gap:6px;
}

.field.full{
    grid-column:1/-1;
}

.field label{
    font-weight:800;
    font-size:13px;
}

.field input,
.field select,
.field textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:11px;
    background:white;
    outline:none;
}

.field textarea{
    min-height:90px;
    resize:vertical;
}

.file{
    border:1px dashed #c4b5fd;
    background:#faf5ff;
    padding:14px;
    border-radius:12px;
}

.preview{
    margin-top:8px;
}

hr{
    border:0;
    border-top:1px solid var(--line);
    margin:18px 0;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .sidebar{
        width:76px;
        padding:15px 9px;
    }

    .logo{
        font-size:0;
        text-align:center;
        padding-left:0;
        padding-right:0;
    }

    .logo:before{
        content:"TC";
        font-size:22px;
    }

    .logo span,
    .logo-sub,
    .nav button span{
        display:none;
    }

    .nav button{
        justify-content:center;
        padding:10px;
        height:58px;
    }

    .nav button.active::after{
        display:none;
    }

    .nav-icon{
        width:40px;
        height:40px;
        min-width:40px;
        font-size:24px;
    }

    .main{
        margin-left:76px;
        width:calc(100% - 76px);
        padding:18px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .formgrid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }

    .topbar .btn{
        width:100%;
    }

    .modalbox{
        padding:19px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="logo">
        Tok<span>Center</span>
        <span class="logo-sub">Gestion d'agence</span>
    </div>

    <nav class="nav" id="nav"></nav>

</aside>


<main class="main">

    <div class="topbar">

        <div class="title">
            <h1 id="pageTitle">Tableau de bord</h1>

            <p id="pageSubtitle">
                Votre centre de gestion d'agence.
            </p>
        </div>

        <button
            class="btn primary"
            onclick="openQuickCreate()"
        >
            ＋ Ajouter
        </button>

    </div>

    <div id="content"></div>

</main>

</div>


<div class="modal" id="modal">

    <div class="modalbox">

        <div class="modalhead">

            <h2 id="modalTitle"></h2>

            <button
                class="close"
                onclick="closeModal()"
            >
                ✕
            </button>

        </div>

        <div id="modalBody"></div>

    </div>

</div>


<script>

/* =========================================================
   BASE DE DONNÉES LOCALE
========================================================= */

const STORAGE_KEY = "tokcenter_v6";

let db =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY) || "null"
    ) ||
    {
        creators:[],
        teams:[],
        matches:[],
        agencies:[],
        settings:{
            agencyName:"LVF Agency"
        }
    };

let page = "dashboard";

let pendingAvatar = "";

let creatorSearch = "";

let agencySearch = "";


/* =========================================================
   SAUVEGARDE
========================================================= */

function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(db)
    );

}


/* =========================================================
   OUTILS
========================================================= */

function uid(){

    return Date.now().toString(36) +
        Math.random().toString(36).slice(2,9);

}


function esc(value=""){

    return String(value).replace(
        /[&<>"']/g,
        char => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[char])
    );

}


function fmtDate(value){

    if(!value) return "—";

    return new Date(
        value + "T00:00:00"
    ).toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function fmtDT(value){

    if(!value) return "—";

    const d = new Date(value);

    return d.toLocaleDateString(
        "fr-FR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    ) +
    " à " +
    d.toLocaleTimeString(
        "fr-FR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


function initials(name){

    return (name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0,2)
        .map(x => x[0])
        .join("")
        .toUpperCase();

}


function creator(id){

    return db.creators.find(
        x => x.id === id
    );

}


function team(id){

    return db.teams.find(
        x => x.id === id
    );

}


function agency(id){

    return db.agencies.find(
        x => x.id === id
    );

}


function avatar(c,big=false){

    if(c && c.avatar){

        return `
            <img
                class="avatar ${big ? "big" : ""}"
                src="${c.avatar}"
                alt=""
            >
        `;

    }

    return `
        <div class="avatar ${big ? "big" : ""}">
            ${esc(initials(c?.name || "?"))}
        </div>
    `;

}


function roleBadge(role){

    return `
        <span class="badge">
            ${esc(role || "Créateur")}
        </span>
    `;

}


/* =========================================================
   NAVIGATION
========================================================= */

const navItems = [

    ["dashboard","🏠","Tableau de bord"],
    ["teams","👥","Teams"],
    ["creators","👤","Créateurs"],
    ["matches","⚔️","Matchs"],
    ["agencies","🏢","Agences adverses"],
    ["calendar","📅","Calendrier"]

];


function renderNav(){

    document.getElementById("nav").innerHTML =
        navItems.map(
            item => `

                <button
                    class="${page === item[0] ? "active" : ""}"
                    onclick="go('${item[0]}')"
                    title="${item[2]}"
                    aria-label="${item[2]}"
                >

                    <span class="nav-icon">
                        ${item[1]}
                    </span>

                    <span>
                        ${item[2]}
                    </span>

                </button>

            `
        ).join("");

}


function go(newPage){

    page = newPage;

    renderNav();

    render();

}


/* =========================================================
   RENDU
========================================================= */

const views = {};


function render(){

    const titles = {

        dashboard:[
            "Tableau de bord",
            "Votre centre de gestion d'agence."
        ],

        teams:[
            "Teams",
            "Gérez vos équipes et leurs créateurs."
        ],

        creators:[
            "Créateurs",
            "Vos membres, leurs rôles et leurs informations."
        ],

        matches:[
            "Matchs",
            "Planifiez et consultez vos matchs TikTok."
        ],

        agencies:[
            "Agences adverses",
            "Votre carnet d'agences enregistré manuellement."
        ],

        calendar:[
            "Calendrier",
            "Vos matchs classés par date."
        ]

    };

    document.getElementById("pageTitle")
        .textContent = titles[page][0];

    document.getElementById("pageSubtitle")
        .textContent = titles[page][1];

    document.getElementById("content")
        .innerHTML = views[page]();

}


/* =========================================================
   DASHBOARD
========================================================= */

views.dashboard = function(){

    const now = new Date();

    const upcoming =
        db.matches
        .filter(
            m =>
                new Date(m.datetime) > now
        )
        .sort(
            (a,b) =>
                new Date(a.datetime) -
                new Date(b.datetime)
        );

    return `

        <div class="grid stats">

            <div class="card stat">

                <div class="label">
                    Teams
                </div>

                <div class="num">
                    ${db.teams.length}
                </div>

            </div>


            <div class="card stat">

                <div class="label">
                    Créateurs
                </div>

                <div class="num">
                    ${db.creators.length}
                </div>

            </div>


            <div class="card stat">

                <div class="label">
                    Matchs à venir
                </div>

                <div class="num">
                    ${upcoming.length}
                </div>

            </div>


            <div class="card stat">

                <div class="label">
                    Agences adverses
                </div>

                <div class="num">
                    ${db.agencies.length}
                </div>

            </div>

        </div>


        <div class="section">

            <h2>
                Prochains matchs
            </h2>

            ${matchList(upcoming.slice(0,4))}

        </div>


        <div class="section">

            <h2>
                Activité récente
            </h2>

            <div class="card">

                ${
                    db.matches.length

                    ?

                    `
                    <div class="list">

                        ${
                            db.matches
                            .slice()
                            .sort(
                                (a,b) =>
                                    new Date(b.datetime) -
                                    new Date(a.datetime)
                            )
                            .slice(0,5)
                            .map(
                                m => `

                                    <div class="listitem">

                                        <div class="row">

                                            <div>

                                                <b>
                                                    ${esc(
                                                        m.ourTeamName ||
                                                        team(m.teamId)?.name ||
                                                        "Team"
                                                    )}
                                                </b>

                                                vs

                                                <b>
                                                    ${esc(
                                                        m.agencyName ||
                                                        "Agence adverse"
                                                    )}
                                                </b>

                                            </div>

                                            <span class="muted">
                                                ${fmtDT(m.datetime)}
                                            </span>

                                        </div>

                                    </div>

                                `
                            )
                            .join("")
                        }

                    </div>
                    `

                    :

                    `
                    <div class="empty">
                        Aucune activité pour le moment.
                    </div>
                    `

                }

            </div>

        </div>

    `;

};


/* =========================================================
   CRÉATEURS
========================================================= */

views.creators = function(){

    const q =
        creatorSearch
        .toLowerCase();

    const list =
        db.creators.filter(
            c =>
                (
                    c.name +
                    " " +
                    c.username +
                    " " +
                    c.role
                )
                .toLowerCase()
                .includes(q)
        );

    return `

        <div class="search">

            <input
                placeholder="🔎 Rechercher un créateur..."
                value="${esc(creatorSearch)}"
                oninput="
                    creatorSearch=this.value;
                    render();
                "
            >

        </div>


        <div
            class="actions"
            style="margin-bottom:16px"
        >

            <button
                class="btn primary"
                onclick="openCreator()"
            >
                ＋ Ajouter un créateur
            </button>

        </div>


        ${
            list.length

            ?

            `
            <div class="grid cards">

                ${
                    list.map(
                        c => `

                            <div class="card">

                                <div class="row">

                                    <div class="person">

                                        ${avatar(c)}

                                        <div>

                                            <b>
                                                ${esc(c.name)}
                                            </b>

                                            <div class="muted">
                                                @${esc(c.username)}
                                            </div>

                                        </div>

                                    </div>

                                    ${roleBadge(c.role)}

                                </div>


                                <div
                                    class="muted"
                                    style="margin-top:14px"
                                >

                                    ${
                                        c.joinDate
                                        ? "Arrivé le " +
                                          fmtDate(c.joinDate)
                                        : "Date d'arrivée non renseignée"
                                    }

                                </div>


                                <div
                                    class="muted"
                                    style="margin-top:5px"
                                >

                                    Teams :

                                    ${
                                        db.teams
                                        .filter(

    return `

                                >

                                            m.ourAgency ||
                                            db.settings.agencyName

                                        ${esc(
                                            m.ourTeamName ||
                                            team(m.teamId)?.name ||
                                            "Team"
                                        )}

                                            esc(c.name) +

                                    >
                                        VS
                                    </div>

function previewAvatar(input){

    const file =
        input.files?.[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(){

            pendingAvatar =
                reader.result;

            const preview =
                document.getElementById(
                    "avatarPreview"
                );

            if(preview){

                preview.innerHTML = `
                    <img
                        src="${pendingAvatar}"
                        class="avatar big"
                    >
                `;

            }

        };

    reader.readAsDataURL(file);

}


function submitCreator(event,id){

    event.preventDefault();

    const c =

        :
        {
            id:uid()
        };

    c.name =
        document
        .getElementById("cname")
        .value
        .trim();

    c.username =
        document
        .getElementById("cuser")
        .value
        .trim()
        .replace(/^@/,"");

    c.role =
        document
        .getElementById("crole")
        .value;

    c.joinDate =
        document
        .getElementById("cdate")
        .value;

    c.avatar =
        pendingAvatar ||
        c.avatar ||
        "";

    if(!id){

        db.creators.push(c);

    }

    pendingAvatar = "";

    save();

    closeModal();

    render();

}

                                    </div>

                                </div>

                            </div>

                        `
                    ).join("")

                    :

                    `
                    <div class="empty">
                        Aucun membre.
                    </div>
                    `

                }

            </div>

        </div>


        <div class="section">

            <h3>
                Matchs de la team
            </h3>

            ${matchList(matches)}

        </div>

        `

    );

}


/* =========================================================
   AGENCES
========================================================= */

}


function submitAgency(event,id){

    event.preventDefault();

    const a =
        id
        ? agency(id)
        :
        {
            id:uid()
        };

    a.name =
        document
        .getElementById("aname")
        .value
        .trim();

    a.favorite =
        document
        .getElementById("afav")
        .value === "1";

    a.notes =
        document
        .getElementById("anotes")
        .value
        .trim();

    if(!id){

        db.agencies.push(a);

    }

    save();

    closeModal();

    render();

}


function toggleFavorite(id){

    const a =
        agency(id);

    if(!a) return;

    a.favorite =
        !a.favorite;

    save();

    render();

}


/* =========================================================
   FICHE AGENCE
========================================================= */

function agencyDetails(id){

    const a =
        agency(id);

    const matches =
        db.matches.filter(
            m =>
                m.agencyId === id
                ||
                (
                    m.agencyName &&
                    m.agencyName
                    .toLowerCase()
                    ===
                    a.name
                    .toLowerCase()
                )
        );

    const teams = [
        ...new Set(
            matches
            .map(
                m =>
                    m.opponentTeam
            )
            .filter(Boolean)
        )
    ];

    const people = [
        ...new Set(
            matches
            .map(
                m =>
                    m.opponentUsername
                    ||
                    m.opponentName
            )
            .filter(Boolean)
        )
    ];

    openModal(

        "Agence — " + a.name,

        `

        <div class="row">

            <div class="person">

                <div class="agency-icon">
                    ${esc(initials(a.name))}
                </div>

                <div>

                    <h2 style="margin:0">
                        ${esc(a.name)}
                    </h2>

                    <div class="muted">

                        ${
                            a.favorite
                            ? "⭐ Agence favorite"
                            : "Agence enregistrée"
                        }

                    </div>

                </div>

            </div>

        </div>


        <div class="section">

            <div class="grid stats">

                <div class="card stat">

                    <div class="label">
                        Matchs
                    </div>

                    <div class="num">
                        ${matches.length}
                    </div>

                </div>


                <div class="card stat">

                    <div class="label">
                        Teams rencontrées
                    </div>

                    <div class="num">
                        ${teams.length}
                    </div>

                </div>

            </div>

        </div>


        <div class="section">

            <h3>
                Teams adverses rencontrées
            </h3>

            <div class="list">

                ${
                    teams.length

                    ?

                    teams.map(
                        x => `
                            <div class="listitem">
                                <b>${esc(x)}</b>
                            </div>
                        `
                    ).join("")

                    :

                    `
                    <div class="muted">
                        Aucune donnée pour le moment.
                    </div>
                    `

                }

            </div>

        </div>


        <div class="section">

            <h3>
                Adversaires rencontrés
            </h3>

            <div class="list">

                ${
                    people.length

                    ?

                    people.map(
                        x => `
                            <div class="listitem">
                                <b>${esc(x)}</b>
                            </div>
                        `
                    ).join("")

                    :

                    `
                    <div class="muted">
                        Aucun adversaire enregistré.
                    </div>
                    `

                }

            </div>

        </div>


        <div class="section">

            <h3>
                Historique des matchs
            </h3>

            ${matchList(matches)}

        </div>


        <div class="section">

            <h3>
                Notes
            </h3>

            <div class="card">

                ${
                    esc(
                        a.notes ||
                        "Aucune note."
                    )
                }

            </div>

        </div>

        `

    );

}


/* =========================================================
   CRÉATION MATCH
========================================================= */

function openMatch(id){

    const m =
        id
        ?
        db.matches.find(
            x =>
                x.id === id
        )
        :
        {
            ourAgency:
                db.settings.agencyName ||
                "LVF Agency",

            teamId:"",
            creatorId:"",
            agencyId:"",
            agencyName:"",
            opponentTeam:"",
            opponentName:"",
            opponentUsername:"",
            datetime:""
        };

    const savedAgencies =
        db.agencies
        .slice()
        .sort(
            (a,b) =>
                Number(b.favorite) -
                Number(a.favorite)
        );

    openModal(

        id
        ? "Modifier le match"
        : "Créer un match",

        `

        <form
            onsubmit="
                submitMatch(event,'${id || ""}')
            "
        >

            <div class="formgrid">


                <div class="field">

                    <label>
                        Notre agence
                    </label>

                    <input
                        id="ourAgency"
                        value="${esc(
                            m.ourAgency ||
                            db.settings.agencyName ||
                            "LVF Agency"
                        )}"
                    >

                </div>


                <div class="field">

                    <label>
                        Notre team *
                    </label>

                    <select
                        id="mteam"
                        required
                        onchange="fillCreators()"
                    >

                        <option value="">
                            Choisir une team...
                        </option>

                        ${
                            db.teams.map(
                                t => `

                                    <option
                                        value="${t.id}"
                                        ${
                                            m.teamId === t.id
                                            ? "selected"
                                            : ""
                                        }
                                    >
                                        ${esc(t.name)}
                                    </option>

                                `
                            ).join("")
                        }

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Notre créateur *
                    </label>

                    <select
                        id="mcreator"
                        required
                    >

                        <option value="">
                            Choisissez d'abord une team...
                        </option>

                    </select>

                </div>


                <div class="field full">

                    <label>
                        Agence adverse
                    </label>


                    <select
                        id="agencySelect"
                        onchange="selectSavedAgency()"
                    >

                        <option value="">
                            ✏️ Nouvelle agence / saisie libre
                        </option>

                        ${
                            savedAgencies.map(
                                a => `

                                    <option
                                        value="${a.id}"
                                        ${
                                            m.agencyId === a.id
                                            ? "selected"
                                            : ""
                                        }
                                    >

                                        ${
                                            a.favorite
                                            ? "⭐ "
                                            : ""
                                        }

                                        ${esc(a.name)}

                                    </option>

                                `
                            ).join("")
                        }

                    </select>


                    <input
                        id="agencyName"
                        style="margin-top:8px"
                        placeholder="Nom de l'agence adverse"
                        value="${esc(
                            m.agencyName || ""
                        )}"
                    >


                    <div
                        class="muted"
                        style="margin-top:6px"
                    >
                        💡 Une agence sélectionnée est
                        réutilisée. Une agence écrite ici
                        n'est pas enregistrée automatiquement.
                    </div>

                </div>


                <div class="field">

                    <label>
                        Team adverse
                    </label>

                    <input
                        id="oppTeam"
                        value="${esc(
                            m.opponentTeam || ""
                        )}"
                        placeholder="Nom de la team adverse"
                    >

                </div>


                <div class="field">

                    <label>
                        Nom de l'adversaire
                    </label>

                    <input
                        id="oppName"
                        value="${esc(
                            m.opponentName || ""
                        )}"
                        placeholder="Nom"
                    >

                </div>


                <div class="field">

                    <label>
                        Pseudo de l'adversaire
                    </label>

                    <input
                        id="oppUser"
                        value="${esc(
                            m.opponentUsername || ""
                        )}"
                        placeholder="@pseudo"
                    >

                </div>


                <div class="field">

                    <label>
                        Date *
                    </label>

                    <input
                        id="mdate"
                        type="date"
                        required
                        value="${
                            m.datetime
                            ?
                            m.datetime.slice(0,10)
                            :
                            ""
                        }"
                    >

                </div>


                <div class="field">

                    <label>
                        Heure *
                    </label>

                    <input
                        id="mtime"
                        type="time"
                        required
                        value="${
                            m.datetime
                            ?
                            m.datetime.slice(11,16)
                            :
                            ""
                        }"
                    >

                </div>

            </div>


            <div
                class="actions"
                style="margin-top:18px"
            >

                <button
                    class="btn primary"
                >
                    Enregistrer le match
                </button>


                <button
                    type="button"
                    class="btn ghost"
                    onclick="closeModal()"
                >
                    Annuler
                </button>

            </div>

        </form>

        `

    );


    setTimeout(
        () => {

            fillCreators(
                m.creatorId || ""
            );

            selectSavedAgency();

        },
        0
    );

}


/* =========================================================
   CRÉATEURS SELON TEAM
========================================================= */

function fillCreators(selected=""){

    const teamId =
        document
        .getElementById("mteam")
        ?.value;

    const select =
        document
        .getElementById("mcreator");

    if(!select) return;

    const ids =
        team(teamId)
        ?.memberIds ||
        [];

    const members =
        db.creators.filter(
            c =>
                ids.includes(c.id)
        );

    select.innerHTML =

        `
        <option value="">
            Choisir un créateur...
        </option>
        `

        +

        members.map(
            c => `

                <option
                    value="${c.id}"
                    ${
                        c.id === selected
                        ? "selected"
                        : ""
                    }
                >
                    ${esc(c.name)}
                    —
                    @${esc(c.username)}
                </option>

            `
        ).join("");

}


/* =========================================================
   AGENCE EXISTANTE
========================================================= */

function selectSavedAgency(){

    const select =
        document
        .getElementById("agencySelect");

    const input =
        document
        .getElementById("agencyName");

    if(!select || !input) return;

    const a =
        agency(select.value);

    if(a){

        input.value =
            a.name;

    }

}


/* =========================================================
   ENREGISTREMENT MATCH
========================================================= */

function submitMatch(event,id){

    event.preventDefault();

    const m =
        id
        ?
        db.matches.find(
            x =>
                x.id === id
        )
        :
        {
            id:uid()
        };


    const agencyId =
        document
        .getElementById("agencySelect")
        .value;


    const selectedAgency =
        agency(agencyId);


    m.ourAgency =
        document
        .getElementById("ourAgency")
        .value
        .trim()
        ||
        "LVF Agency";


    m.teamId =
        document
        .getElementById("mteam")
        .value;


    m.ourTeamName =
        team(m.teamId)
        ?.name ||
        "";


    m.creatorId =
        document
        .getElementById("mcreator")
        .value;


    /*
       L'agence n'est liée à une agence enregistrée
       que si l'utilisateur l'a explicitement sélectionnée.
    */

    m.agencyId =
        selectedAgency
        ?
        selectedAgency.id
        :
        "";


    m.agencyName =
        document
        .getElementById("agencyName")
        .value
        .trim();


    m.opponentTeam =
        document
        .getElementById("oppTeam")
        .value
        .trim();


    m.opponentName =
        document
        .getElementById("oppName")
        .value
        .trim();


    m.opponentUsername =
        document
        .getElementById("oppUser")
        .value
        .trim()
        .replace(/^@/,"");


    const date =
        document
        .getElementById("mdate")
        .value;


    const time =
        document
        .getElementById("mtime")
        .value;


    m.datetime =
        date +
        "T" +
        time;


    if(!id){

        db.matches.push(m);

    }


    save();

    closeModal();

    render();

}


/* =========================================================
   DÉTAILS MATCH
========================================================= */

    const m =
        db.matches.find(
            x =>
                x.id === id
        );

    const c =

    openModal(

        "Détails du match",

        `

        <div class="card">

            <div class="muted">
                ${fmtDT(m.datetime)}
            </div>


            <h2>

                ${esc(
                    m.ourAgency ||
                    "LVF Agency"
                )}

                ·

                ${esc(
                    m.ourTeamName ||
                    "Team"
                )}

            </h2>


            <div class="person">

                ${
                    c
                    ?
                    avatar(c)
                    :
                    ""
                }

                <div>

                    <b>
                        ${
                            c
                            ?
                            esc(c.name)
                            :
                            "Créateur non renseigné"
                        }
                    </b>

                    <div class="muted">

                        ${
                            c
                            ?
                            "@" +
                            esc(c.username)
                            :
                            ""
                        }

                    </div>

                </div>

            </div>


            <hr>


            <div class="muted">
                AGENCE ADVERSE
            </div>


            <h2>

                ${esc(
                    m.agencyName ||
                    "—"
                )}

                ${
                    m.opponentTeam
                    ?
                    `
                    ·
                    ${esc(m.opponentTeam)}
                    `
                    :
                    ""
                }

            </h2>


            <div>

                <b>
                    ${esc(
                        m.opponentName ||
                        "—"
                    )}
                </b>

                ${
                    m.opponentUsername
                    ?
                    `
                    <span class="muted">
                        (@${esc(
                            m.opponentUsername
                        )})
                    </span>
                    `
                    :
                    ""
                }

            </div>

        </div>


        <div
            class="actions"
            style="margin-top:14px"
        >

            <button
                class="btn ghost"
                onclick="
                    openMatch('${id}')
                "
            >
                Modifier
            </button>


            <button
                class="btn danger"
                onclick="
                    deleteMatch('${id}')
                "
            >
                Supprimer
            </button>

        </div>

        `

    );

}


/* =========================================================
   SUPPRESSION MATCH
========================================================= */

function deleteMatch(id){

    if(
        !confirm(
            "Voulez-vous vraiment supprimer ce match ?"
        )
    ){

        return;

    }

    db.matches =
        db.matches.filter(
            m =>
                m.id !== id
        );

    save();

    closeModal();

    render();

}


/* =========================================================
   FERMETURE MODALE EN CLIQUANT À L'EXTÉRIEUR
========================================================= */

document
.getElementById("modal")
.addEventListener(
    "click",
    function(event){

        if(
            event.target.id === "modal"
        ){

            closeModal();

        }

    }
);


/* =========================================================
   INITIALISATION
========================================================= */

renderNav();

render();

</script>

</html>
